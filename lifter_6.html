<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="LIFTER" />
<meta name="theme-color" content="#1a1b3a" />
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' fill='%231a1b3a'/><text x='90' y='118' font-family='serif' font-style='italic' font-size='90' font-weight='700' fill='%23f5b66c' text-anchor='middle'>L</text></svg>" />
<title>LIFTER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root {
    /* TWILIGHT PALETTE */
    --bg: #14152e;            /* deep indigo, almost midnight */
    --bg-deep: #0e0f22;       /* darker for layering */
    --surface: #1d1f44;       /* card surface */
    --surface-2: #262956;     /* nested surface */
    --surface-3: #303369;     /* hover/active surface */
    --border: #2d3060;        /* subtle border */
    --border-strong: #3e4382; /* prominent border */
    
    --text: #f5ead0;          /* warm cream — primary */
    --text-soft: #e8dcc0;     /* slightly dimmer cream */
    --text-dim: #9b94b8;      /* muted lavender-grey */
    --text-faint: #5d5a82;    /* very faint */
    
    --accent: #f5b66c;        /* warm amber — primary accent */
    --accent-bright: #ffc987; /* brighter amber for highlights */
    --accent-deep: #c8884a;   /* darker amber */
    --accent-glow: rgba(245, 182, 108, 0.15);
    
    --danger: #e87b7b;        /* dusty coral instead of harsh red */
    --success: #8dd9a8;       /* muted sage green */
    --warning: #e8c97b;       /* dimmer amber-gold */
    --office: #8aa3e8;        /* soft periwinkle for office mode */
    --pr: #ffd4a0;            /* pale gold for PR highlights */
    
    --mono: 'JetBrains Mono', 'SF Mono', 'Courier New', monospace;
    --display: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    
    --shadow-soft: 0 4px 16px rgba(10, 11, 30, 0.4);
    --shadow-strong: 0 12px 40px rgba(10, 11, 30, 0.6);
  }
  
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    background-image: radial-gradient(ellipse at top, rgba(245, 182, 108, 0.05), transparent 60%);
    color: var(--text);
    font-family: var(--sans);
    overscroll-behavior: none;
  }
  body {
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea { font-family: inherit; }
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  
  .app { max-width: 600px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  
  .header {
    padding: 14px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(20, 21, 46, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 10;
    gap: 8px;
  }
  .header-title {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.22em;
    color: var(--text-dim);
    flex: 1;
    text-align: center;
  }
  .header-title strong {
    color: var(--accent);
    font-family: var(--display);
    font-style: italic;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0;
  }
  .back-btn {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    padding: 4px 6px;
    white-space: nowrap;
    transition: color 0.15s;
  }
  .back-btn:active { color: var(--accent); }
  
  .content { flex: 1; padding: 20px; padding-bottom: 100px; }
  .content-tight { padding: 16px 20px 100px; }
  
  /* ============ HOME ============ */
  .home-brand {
    font-family: var(--display);
    font-style: italic;
    font-weight: 900;
    font-size: 64px;
    letter-spacing: -0.04em;
    line-height: 0.9;
    margin-bottom: 2px;
    background: linear-gradient(135deg, var(--accent-bright), var(--accent-deep));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .home-brand-line {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.3em;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .home-brand-line::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  
  /* Stats strip */
  .stats-strip {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .stat-cell {
    background: var(--surface);
    padding: 14px 10px;
    text-align: center;
  }
  .stat-value {
    font-family: var(--display);
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 4px;
  }
  .stat-value.zero { color: var(--text-faint); }
  .stat-label {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  
  /* Continue card — the big "widget" */
  .continue-card {
    background: linear-gradient(140deg, var(--surface-2), var(--surface));
    border: 1px solid var(--accent-deep);
    padding: 22px;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
    width: 100%;
    text-align: left;
    box-shadow: var(--shadow-soft);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .continue-card::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, var(--accent-glow), transparent 70%);
    pointer-events: none;
  }
  .continue-card:active {
    transform: scale(0.99);
    box-shadow: var(--shadow-strong);
  }
  .continue-card .continue-tap-area {
    cursor: pointer;
  }
  .continue-top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
  }
  
  /* Inline gym mode pill (used on continue card AND session header) */
  .gym-pill {
    display: inline-flex;
    background: rgba(20, 21, 46, 0.6);
    border: 1px solid var(--border);
    padding: 2px;
    gap: 2px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    position: relative;
    z-index: 2;
  }
  .gym-pill-opt {
    padding: 5px 10px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    text-transform: uppercase;
    transition: all 0.15s;
    cursor: pointer;
    border-radius: 0;
  }
  .gym-pill-opt.active-main {
    background: var(--accent);
    color: var(--bg-deep);
  }
  .gym-pill-opt.active-office {
    background: var(--office);
    color: var(--bg-deep);
  }
  .gym-pill-opt:not(.active-main):not(.active-office):active {
    color: var(--text);
  }
  .continue-eyebrow {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 10px;
    position: relative;
  }
  .continue-eyebrow::before {
    content: '▸';
    margin-right: 6px;
  }
  .continue-week {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    margin-bottom: 4px;
  }
  .continue-day {
    font-family: var(--display);
    font-style: italic;
    font-weight: 700;
    font-size: 38px;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 12px;
    color: var(--text);
  }
  .continue-detail {
    font-family: var(--sans);
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.5;
  }
  .continue-cta {
    margin-top: 16px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
  }
  
  .continue-card-done {
    background: var(--surface);
    border-color: var(--border);
    text-align: center;
  }
  .continue-card-done::before { display: none; }
  
  .section-heading {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-heading::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  
  .program-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 18px;
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    text-align: left;
    transition: border-color 0.15s, transform 0.1s;
  }
  .program-card:active { border-color: var(--accent); transform: scale(0.99); }
  .program-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .program-name {
    font-family: var(--display);
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .program-meta {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    margin-top: 2px;
  }
  .program-progress {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }
  .progress-bar {
    flex: 1;
    height: 3px;
    background: var(--border);
    position: relative;
    overflow: hidden;
  }
  .progress-bar-fill {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, var(--accent-deep), var(--accent));
    transform-origin: left;
    transition: transform 0.4s ease-out;
  }
  .program-tag {
    display: inline-block;
    font-family: var(--mono);
    font-size: 9px;
    padding: 3px 7px;
    background: var(--accent);
    color: var(--bg-deep);
    font-weight: 700;
    letter-spacing: 0.12em;
  }
  
  /* ============ BUTTONS ============ */
  .btn-primary {
    width: 100%;
    background: linear-gradient(180deg, var(--accent-bright), var(--accent));
    color: var(--bg-deep);
    padding: 18px;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-family: var(--mono);
    transition: opacity 0.15s, transform 0.1s;
    box-shadow: 0 4px 20px rgba(245, 182, 108, 0.2);
  }
  .btn-primary:active { opacity: 0.9; transform: translateY(1px); }
  .btn-primary:disabled { opacity: 0.3; box-shadow: none; }
  
  .btn-secondary {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    color: var(--text);
    padding: 15px;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-family: var(--mono);
    transition: background 0.15s;
  }
  .btn-secondary:active { background: var(--surface-2); }
  
  .btn-ghost {
    color: var(--text-dim);
    padding: 12px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  
  .fab {
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 40px);
    max-width: 560px;
    z-index: 20;
  }
  
  /* ============ FORMS ============ */
  .form-group { margin-bottom: 20px; }
  .form-label {
    display: block;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .form-input, .form-select {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    padding: 14px;
    color: var(--text);
    font-size: 16px;
    font-family: var(--sans);
    transition: border-color 0.15s;
  }
  .form-input:focus, .form-select:focus { outline: none; border-color: var(--accent); }
  
  .seg {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    padding: 3px;
    gap: 3px;
  }
  .seg-opt {
    flex: 1;
    padding: 12px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--text-dim);
    text-align: center;
    transition: color 0.15s;
  }
  .seg-opt.active { background: var(--accent); color: var(--bg-deep); }
  .seg-opt.active-office { background: var(--office); color: var(--bg-deep); }
  
  /* ============ BUILDER ============ */
  .day-tabs { display: flex; gap: 4px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .day-tabs::-webkit-scrollbar { display: none; }
  .day-tab {
    flex: 0 0 auto;
    padding: 10px 16px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    white-space: nowrap;
  }
  .day-tab.active { background: var(--text); color: var(--bg-deep); border-color: var(--text); }
  
  .exercise-row {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 14px;
    margin-bottom: 8px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .exercise-row-handle { font-family: var(--mono); color: var(--text-faint); font-size: 13px; width: 18px; }
  .exercise-row-main { flex: 1; min-width: 0; }
  .exercise-row-name {
    font-weight: 600;
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }
  .exercise-row-detail {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }
  .exercise-row-del { color: var(--text-faint); padding: 8px; font-size: 18px; }
  
  .add-exercise-btn {
    width: 100%;
    background: transparent;
    border: 1px dashed var(--border-strong);
    color: var(--text-dim);
    padding: 14px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    transition: color 0.15s, border-color 0.15s;
  }
  .add-exercise-btn:active { border-color: var(--accent); color: var(--accent); }
  
  /* ============ MODAL ============ */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 11, 30, 0.75);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 100;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    animation: fadein 0.18s;
  }
  @keyframes fadein { from { opacity: 0; } }
  @keyframes slideup { from { transform: translateY(20px); opacity: 0; } }
  @keyframes pop { 
    0% { transform: scale(0.9); opacity: 0; }
    60% { transform: scale(1.03); }
    100% { transform: scale(1); opacity: 1; }
  }
  .modal {
    background: var(--surface);
    width: 100%;
    max-width: 600px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px 20px;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    border-top: 2px solid var(--accent);
    animation: slideup 0.22s ease-out;
  }
  .modal-title {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.22em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .modal-row { display: flex; gap: 10px; margin-bottom: 10px; }
  
  /* ============ SESSION (workout) ============ */
  .workout-header { margin-bottom: 20px; }
  .workout-week {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .workout-day-title {
    font-family: var(--display);
    font-style: italic;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1;
    margin-bottom: 8px;
    color: var(--text);
  }
  .workout-date {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.08em;
  }
  
  /* Today at a glance */
  .glance-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 12px 14px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .glance-stat {
    flex: 0 0 auto;
  }
  .glance-stat-value {
    font-family: var(--display);
    font-weight: 700;
    font-size: 22px;
    color: var(--accent);
    line-height: 1;
  }
  .glance-stat-label {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-faint);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 3px;
  }
  .glance-divider { width: 1px; height: 24px; background: var(--border); }
  .glance-progress {
    flex: 1;
    height: 4px;
    background: var(--border);
    position: relative;
    overflow: hidden;
  }
  .glance-progress-fill {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, var(--accent-deep), var(--accent));
    transform-origin: left;
    transition: transform 0.3s ease-out;
  }
  
  /* Exercise blocks */
  .exercise-block {
    margin-bottom: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    transition: border-color 0.25s, opacity 0.2s;
  }
  .exercise-block.swapped { border-left: 3px solid var(--office); }
  .exercise-block.has-pr {
    border-color: var(--pr);
    box-shadow: 0 0 0 1px rgba(255, 212, 160, 0.2);
  }
  
  /* Up-next exercise — subtle amber accent on the left edge */
  .exercise-block.is-next:not(.collapsed) {
    border-color: var(--accent-deep);
    border-left: 3px solid var(--accent);
    box-shadow: 0 0 24px rgba(245, 182, 108, 0.08);
  }
  /* Completed exercises render slightly dimmer when collapsed */
  .exercise-block.collapsed {
    background: var(--surface);
    opacity: 0.85;
  }
  .exercise-block.collapsed:hover { opacity: 1; }
  
  /* Collapsed exercise: single-line summary */
  .exercise-block-collapsed {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    text-align: left;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    min-height: 50px;
  }
  .exercise-block-collapsed:active { background: var(--surface-2); }
  .collapsed-check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--bg-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 800;
    flex: 0 0 auto;
  }
  .collapsed-name {
    flex: 1;
    min-width: 0;
    font-weight: 600;
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-dim);
  }
  .collapsed-top {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.04em;
    flex: 0 0 auto;
  }
  .collapsed-expand {
    color: var(--text-faint);
    font-size: 14px;
    flex: 0 0 auto;
  }
  
  /* Up-next marker before exercise name */
  .next-marker {
    color: var(--accent);
    margin-right: 6px;
    font-size: 14px;
  }
  
  /* Set progress indicator (e.g. "1/2") inside exercise target line */
  .set-progress {
    color: var(--accent);
    font-weight: 700;
  }
  .exercise-block.status-complete:not(.collapsed) .set-progress {
    color: var(--accent);
  }
  
  /* ============ JUMP BAR ============ */
  .jump-bar {
    display: flex;
    gap: 6px;
    padding: 8px 0 16px;
    overflow-x: auto;
    scrollbar-width: none;
    margin: 0 -4px;
    padding-left: 4px;
    padding-right: 4px;
  }
  .jump-bar::-webkit-scrollbar { display: none; }
  .jump-pill {
    flex: 0 0 auto;
    min-width: 38px;
    height: 38px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 4px 8px;
    transition: all 0.15s;
    position: relative;
  }
  .jump-pill:active { transform: scale(0.92); }
  .jump-pill-num {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    color: var(--text-dim);
    line-height: 1;
  }
  .jump-pill-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    border: 1px solid var(--text-faint);
    background: transparent;
  }
  .jump-untouched .jump-pill-dot {
    border-color: var(--text-faint);
    background: transparent;
  }
  .jump-partial .jump-pill-dot {
    border-color: var(--accent);
    background: linear-gradient(to right, var(--accent) 50%, transparent 50%);
  }
  .jump-complete {
    background: var(--surface-2);
  }
  .jump-complete .jump-pill-num {
    color: var(--text-faint);
  }
  .jump-complete .jump-pill-dot {
    border-color: var(--accent);
    background: var(--accent);
  }
  .jump-pill.is-next {
    background: var(--accent);
    border-color: var(--accent);
  }
  .jump-pill.is-next .jump-pill-num {
    color: var(--bg-deep);
  }
  .jump-pill.is-next .jump-pill-dot {
    border-color: var(--bg-deep);
    background: transparent;
  }
  .jump-pill.is-next.jump-partial .jump-pill-dot {
    background: linear-gradient(to right, var(--bg-deep) 50%, transparent 50%);
  }
  .exercise-block-header {
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .exercise-block-title {
    flex: 1;
    min-width: 0;
    font-weight: 700;
    font-size: 16px;
    color: var(--text);
  }
  .exercise-block-target {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    margin-top: 3px;
    font-weight: 400;
  }
  .exercise-actions { display: flex; gap: 4px; }
  .exercise-action-btn {
    color: var(--text-dim);
    padding: 6px 9px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    background: var(--surface-2);
    border: 1px solid var(--border);
    transition: color 0.15s, border-color 0.15s;
  }
  .exercise-action-btn:active { color: var(--accent); border-color: var(--accent); }
  
  .pr-badge {
    display: inline-block;
    background: var(--pr);
    color: var(--bg-deep);
    padding: 2px 6px;
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.15em;
    margin-left: 8px;
    vertical-align: 2px;
    animation: pop 0.4s ease-out;
  }
  
  /* Sets grid */
  .sets-grid { padding: 8px; }
  .set-row {
    display: grid;
    grid-template-columns: 32px 1fr 1fr 60px 36px;
    gap: 6px;
    align-items: center;
    padding: 6px 4px;
  }
  .set-row.headers { padding: 6px 4px 4px; }
  .set-header-cell {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-faint);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-align: center;
  }
  .set-num {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 700;
    text-align: center;
  }
  .set-num.is-pr {
    color: var(--pr);
  }
  .set-input {
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 12px 6px;
    color: var(--text);
    font-size: 16px;
    font-family: var(--mono);
    font-weight: 500;
    text-align: center;
    width: 100%;
    border-radius: 0;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
  }
  .set-input::placeholder { color: var(--text-faint); font-weight: 400; }
  .set-input:focus { outline: none; border-color: var(--accent); }
  .set-input.done { 
    border-color: var(--accent-deep); 
    background: rgba(245, 182, 108, 0.06);
    color: var(--accent-bright);
  }
  .set-input.ghost {
    color: var(--text-faint);
    font-style: italic;
  }
  .set-check {
    width: 36px;
    height: 42px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .set-check.done {
    background: var(--accent);
    color: var(--bg-deep);
    border-color: var(--accent);
    box-shadow: 0 0 12px rgba(245, 182, 108, 0.4);
  }
  .set-check:active { transform: scale(0.92); }
  
  /* Preview mode (session not yet started) — logging is disabled, configuration is allowed */
  .session-preview .set-input,
  .session-preview .set-check,
  .session-preview .notes-textarea {
    opacity: 0.5;
    pointer-events: none;
  }
  /* SUB, EDIT, and add-set remain interactive — you can configure before starting */
  .session-preview .exercise-action-btn,
  .session-preview .add-exercise-btn { opacity: 0.85; }
  .session-preview .glance-bar { opacity: 0.6; }
  
  .preview-banner {
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    border-left: 3px solid var(--accent);
    padding: 14px 16px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .preview-banner-icon {
    font-family: var(--mono);
    font-size: 20px;
    color: var(--accent);
  }
  .preview-banner-text {
    flex: 1;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    line-height: 1.5;
  }
  .preview-banner-text strong {
    color: var(--accent);
    letter-spacing: 0.15em;
  }
  
  /* ============ TEMPLATE CHIPS (preview only) ============ */
  .template-chips {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    padding: 4px 0;
  }
  .template-chips-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text-faint);
    text-transform: uppercase;
    margin-right: 4px;
  }
  .template-chip {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    padding: 6px 11px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--text);
    transition: all 0.15s;
  }
  .template-chip:active { transform: scale(0.96); }
  .template-chip.is-office {
    border-color: var(--office);
    color: var(--office);
  }
  .template-chip.is-office:active { background: rgba(138, 163, 232, 0.12); }
  
  /* ============ TEMPLATE MODALS ============ */
  .template-list-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    width: 100%;
    text-align: left;
    background: transparent;
    color: var(--text);
  }
  .template-list-item:last-child { border-bottom: none; }
  .template-list-item:active { background: var(--surface-2); }
  .template-list-info {
    flex: 1;
    min-width: 0;
  }
  .template-list-name {
    font-weight: 600;
    font-size: 14px;
    color: var(--text);
    margin-bottom: 3px;
  }
  .template-list-meta {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }
  .template-list-tag {
    display: inline-block;
    background: var(--office);
    color: var(--bg-deep);
    padding: 1px 5px;
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    margin-left: 6px;
    vertical-align: 1px;
  }
  .template-list-delete {
    background: transparent;
    color: var(--text-faint);
    padding: 6px 8px;
    font-size: 14px;
    font-family: var(--mono);
    border: 1px solid var(--border);
  }
  .template-list-delete:active { color: var(--danger); border-color: var(--danger); }
  
  /* Copy targets list */
  .copy-target-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    width: 100%;
    text-align: left;
    background: transparent;
    color: var(--text);
  }
  .copy-target-row:last-child { border-bottom: none; }
  .copy-target-check {
    width: 22px;
    height: 22px;
    border: 1px solid var(--border-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    flex: 0 0 auto;
  }
  .copy-target-row.checked .copy-target-check {
    background: var(--accent);
    color: var(--bg-deep);
    border-color: var(--accent);
  }
  .copy-target-label {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
  }
  .copy-target-row:not(.checked) { opacity: 0.55; }
  
  .copy-includes {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }
  .copy-include-toggle {
    flex: 1;
    padding: 12px;
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .copy-include-toggle.on {
    background: var(--accent);
    color: var(--bg-deep);
    border-color: var(--accent);
  }
  
  /* Thin rest timer at top */
  .rest-strip {
    position: fixed;
    top: env(safe-area-inset-top);
    left: 0;
    right: 0;
    height: 3px;
    background: var(--border);
    z-index: 50;
  }
  .rest-strip-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-deep), var(--accent), var(--accent-bright));
    transition: width 1s linear;
  }
  .rest-label {
    position: fixed;
    top: calc(env(safe-area-inset-top) + 8px);
    right: 16px;
    background: var(--bg-deep);
    color: var(--accent);
    padding: 4px 10px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    z-index: 51;
    border: 1px solid var(--accent-deep);
    animation: slideup 0.18s ease-out;
  }
  .rest-label.done {
    color: var(--success);
    border-color: var(--success);
  }
  
  /* ============ HISTORY (program view weeks) ============ */
  .history-week { margin-bottom: 20px; }
  .history-week-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  .history-day {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .history-day-name { font-weight: 600; color: var(--text); }
  .history-day-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    margin-top: 2px;
  }
  .history-day-status {
    font-family: var(--mono);
    font-size: 9px;
    padding: 4px 8px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .status-done { background: var(--accent); color: var(--bg-deep); }
  .status-partial { background: var(--warning); color: var(--bg-deep); }
  .status-todo {
    background: var(--surface-2);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .status-skipped {
    background: transparent;
    color: var(--text-faint);
    border: 1px dashed var(--border-strong);
  }
  .status-next {
    background: var(--accent);
    color: var(--bg-deep);
    animation: glow 2s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245, 182, 108, 0); }
    50% { box-shadow: 0 0 16px 2px rgba(245, 182, 108, 0.5); }
  }
  
  /* ============ PROGRESSION ============ */
  .prog-exercise { margin-bottom: 24px; }
  .prog-exercise-name {
    font-family: var(--display);
    font-weight: 700;
    font-size: 18px;
    margin-bottom: 8px;
    color: var(--text);
  }
  .prog-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
  .prog-table th {
    text-align: left;
    color: var(--text-faint);
    font-weight: 500;
    padding: 8px 4px;
    border-bottom: 1px solid var(--border);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-size: 10px;
  }
  .prog-table td {
    padding: 9px 4px;
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
  }
  .prog-table td.current { color: var(--accent); font-weight: 700; }
  
  /* ============ EMPTY / MISC ============ */
  .empty { text-align: center; padding: 50px 20px; color: var(--text-dim); }
  .empty-icon {
    font-family: var(--display);
    font-size: 64px;
    margin-bottom: 14px;
    color: var(--text-faint);
    font-style: italic;
    opacity: 0.6;
  }
  .empty-text {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  
  .notes-textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 12px;
    color: var(--text-soft);
    font-size: 14px;
    font-family: var(--sans);
    min-height: 80px;
    resize: vertical;
    transition: border-color 0.15s;
  }
  .notes-textarea:focus { outline: none; border-color: var(--accent); }
  .notes-textarea::placeholder { color: var(--text-faint); font-style: italic; }
  .exercise-notes-section { padding: 0 8px 12px; }
  
  .menu-item {
    width: 100%;
    text-align: left;
    padding: 16px;
    font-size: 15px;
    border-bottom: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .menu-item:active { background: var(--surface-2); }
  .menu-item.danger { color: var(--danger); }
  .menu-item .arrow { color: var(--text-faint); }
  
  .divider { height: 1px; background: var(--border); margin: 20px 0; }
  .text-dim { color: var(--text-dim); }
  .text-faint { color: var(--text-faint); }
  .mono { font-family: var(--mono); }
  
  .lib-search {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    padding: 14px;
    color: var(--text);
    font-size: 16px;
    margin-bottom: 12px;
  }
  .lib-list { max-height: 50vh; overflow-y: auto; margin: 0 -20px; }
  .lib-item {
    width: 100%;
    text-align: left;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    background: transparent;
    font-size: 15px;
  }
  .lib-item:active { background: var(--surface-2); }
  .lib-item-cat {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.1em;
    margin-top: 3px;
  }
  
  .section-title {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-faint);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding: 14px 20px 6px;
  }
  .alt-item { border-left: 3px solid var(--accent); }
  
  .toast {
    position: fixed;
    bottom: 32%;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 14px 22px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.15em;
    z-index: 200;
    animation: pop 0.25s ease-out;
    box-shadow: var(--shadow-strong);
  }
  
  .badge-office {
    display: inline-block;
    background: var(--office);
    color: var(--bg-deep);
    padding: 1px 6px;
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    margin-left: 6px;
    vertical-align: 2px;
  }
  
  /* ============ SUMMARY ============ */
  .summary-bg {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at top, rgba(245, 182, 108, 0.12), var(--bg) 60%);
    z-index: 0;
  }
  .summary-content {
    position: relative;
    z-index: 1;
    padding: 40px 24px;
    padding-top: calc(40px + env(safe-area-inset-top));
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .summary-eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 12px;
    text-align: center;
    animation: slideup 0.4s ease-out;
  }
  .summary-title {
    font-family: var(--display);
    font-style: italic;
    font-weight: 900;
    font-size: 56px;
    letter-spacing: -0.03em;
    line-height: 0.95;
    text-align: center;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent-bright), var(--accent-deep));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: slideup 0.5s ease-out 0.1s both;
  }
  .summary-sub {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-align: center;
    margin-bottom: 36px;
    text-transform: uppercase;
    animation: slideup 0.5s ease-out 0.15s both;
  }
  .summary-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 28px;
  }
  .summary-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 20px 16px;
    text-align: center;
    animation: slideup 0.5s ease-out both;
  }
  .summary-stat:nth-child(1) { animation-delay: 0.2s; }
  .summary-stat:nth-child(2) { animation-delay: 0.25s; }
  .summary-stat:nth-child(3) { animation-delay: 0.3s; }
  .summary-stat:nth-child(4) { animation-delay: 0.35s; }
  .summary-stat-value {
    font-family: var(--display);
    font-weight: 700;
    font-size: 36px;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 6px;
  }
  .summary-stat-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .summary-prs {
    background: var(--surface);
    border: 1px solid var(--pr);
    padding: 20px;
    margin-bottom: 28px;
    animation: slideup 0.5s ease-out 0.4s both;
  }
  .summary-prs-title {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--pr);
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .summary-pr-item {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 14px;
  }
  .summary-pr-item:last-child { border-bottom: none; }
  .summary-pr-name { color: var(--text); flex: 1; }
  .summary-pr-vals {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    font-weight: 700;
  }
  .summary-pr-vals .prev {
    color: var(--text-faint);
    text-decoration: line-through;
    font-weight: 400;
    margin-right: 6px;
  }
  
  /* Skip candidates */
  .summary-skip {
    background: var(--surface);
    border: 1px solid var(--border-strong);
