  const overrides = [];
  day.exercises.forEach(ex => {
    const swap = getOfficeSwap(ex.name);
    if (swap) {
      overrides.push({ exerciseId: ex.id, name: swap });
    }
  });
  if (overrides.length === 0) return null;
  return {
    id: uid(),
    name: `Office — ${day.name}`,
    dayId: day.id,
    overrides,
    gymMode: 'office',
    auto: true,
  };
};

// Seed office templates onto a program if none exist for a given day.
// Returns a new program object with .templates updated, or the same program if no changes.
const seedOfficeTemplates = (program) => {
  const existing = program.templates || [];
  const newTemplates = [];
  program.days.forEach(day => {
    // Only seed if no template exists for this day with auto:true
    const alreadyHasAuto = existing.some(t => t.dayId === day.id && t.auto);
    if (alreadyHasAuto) return;
    const tmpl = generateOfficeTemplate(day);
    if (tmpl) newTemplates.push(tmpl);
  });
  if (newTemplates.length === 0 && existing.length === program.templates?.length) return program;
  return { ...program, templates: [...existing, ...newTemplates] };
};

// Given a template and a current log, return a new log with the template's overrides applied.
// The log is the in-progress session log. We only modify entries where exerciseId matches.
// Overrides set: name, prescription (sets/repsMin/repsMax/rest). If sets count changes, we
// resize the sets array (adding blank sets or trimming).
const applyTemplateToLog = (log, template) => {
  if (!template?.overrides) return log;
  return log.map(logEx => {
    const ov = template.overrides.find(o => o.exerciseId === logEx.exerciseId);
    if (!ov) return logEx;
    const next = { ...logEx };
    if (ov.name) {
      next._originalName = logEx._originalName || logEx.name;
      next.name = ov.name;
    }
    // Build a prescription override containing any provided fields
    const prescriptionFields = ['sets', 'repsMin', 'repsMax', 'rest'];
    const hasAnyPrescription = prescriptionFields.some(f => ov[f] != null);
    if (hasAnyPrescription) {
      const currentPrescription = logEx.prescription || {};
      const newPrescription = { ...currentPrescription };
      prescriptionFields.forEach(f => {
        if (ov[f] != null) newPrescription[f] = ov[f];
      });
      next.prescription = newPrescription;
      // Resize sets array if needed
      if (ov.sets != null && ov.sets !== next.sets.length) {
        const diff = ov.sets - next.sets.length;
        if (diff > 0) {
          next.sets = [...next.sets, ...Array.from({ length: diff }, () => blankSet())];
        } else {
          next.sets = next.sets.slice(0, ov.sets);
        }
      }
    }
    return next;
  });
};

// Snapshot current log overrides into a template payload (relative to the program's day baseline).
// Returns array of overrides for fields that differ from program defaults.
const snapshotOverrides = (log, day) => {
  return log.map(logEx => {
    const baseEx = day.exercises.find(e => e.id === logEx.exerciseId);
    if (!baseEx) return null;
    const ov = { exerciseId: logEx.exerciseId };
    let any = false;
    const originalName = logEx._originalName || baseEx.name;
    if (logEx.name !== originalName && logEx.name !== baseEx.name) {
      ov.name = logEx.name;
      any = true;
    }
    const p = logEx.prescription;
    if (p) {
      if (p.sets != null && p.sets !== baseEx.sets) { ov.sets = p.sets; any = true; }
      if (p.repsMin != null && p.repsMin !== baseEx.repsMin) { ov.repsMin = p.repsMin; any = true; }
      if (p.repsMax != null && p.repsMax !== baseEx.repsMax) { ov.repsMax = p.repsMax; any = true; }
      if (p.rest != null && p.rest !== baseEx.rest) { ov.rest = p.rest; any = true; }
    } else if (logEx.sets.length !== baseEx.sets) {
      ov.sets = logEx.sets.length;
      any = true;
    }
    return any ? ov : null;
  }).filter(Boolean);
};

// ============ STREAK + STATS ============
const computeGlobalStats = (state) => {
  let totalCompleted = 0;
  const completedDates = [];
  state.programs.forEach(p => {
    Object.values(p.sessions || {}).forEach(s => {
      if (s.completedAt) {
        totalCompleted++;
        completedDates.push(s.date);
      }
    });
  });
  completedDates.sort();
  
  // Streak: count back from today (or most recent) — gap of more than 3 days breaks streak
  const uniqueDates = [...new Set(completedDates)].sort();
  let streak = 0;
  if (uniqueDates.length > 0) {
    const todayStr = today();
    const todayD = new Date(todayStr + 'T00:00');
    const lastD = new Date(uniqueDates[uniqueDates.length - 1] + 'T00:00');
    const daysSinceLast = Math.floor((todayD - lastD) / 86400000);
    if (daysSinceLast <= 3) {
      streak = 1;
      for (let i = uniqueDates.length - 1; i > 0; i--) {
        const cur = new Date(uniqueDates[i] + 'T00:00');
        const prev = new Date(uniqueDates[i-1] + 'T00:00');
        const gap = Math.floor((cur - prev) / 86400000);
        if (gap <= 3) streak++;
        else break;
      }
    }
  }
  
  return { totalCompleted, streak, totalWeeks: Math.ceil(totalCompleted / 4) };
};

// Compute stats for a single session log (used for past-session summary)
const computeSessionStats = (log) => {
  let totalSets = 0, completedSets = 0, totalVolume = 0;
  log.forEach(ex => {
    ex.sets.forEach(s => {
      totalSets++;
      if (s.done) {
        completedSets++;
        const w = parseFloat(s.weight) || 0;
        const r = parseInt(s.reps) || 0;
        totalVolume += w * r;
      }
    });
  });
  return { totalSets, completedSets, totalVolume };
};

// Stats for an entire week of a program
const computeWeekStats = (program, week) => {
  let totalSets = 0, completedSets = 0, totalVolume = 0;
  let workoutsCompleted = 0, workoutsSkipped = 0;
  const dayBreakdown = [];
  for (let d = 0; d < program.days.length; d++) {
    const s = program.sessions?.[`w${week}d${d}`];
    if (s?.completedAt) {
      workoutsCompleted++;
      const stats = computeSessionStats(s.log || []);
      totalSets += stats.totalSets;
      completedSets += stats.completedSets;
      totalVolume += stats.totalVolume;
      dayBreakdown.push({
        dayIdx: d,
        dayName: program.days[d].name,
        date: s.date,
        ...stats,
        status: 'done',
      });
    } else if (s?.skipped) {
      workoutsSkipped++;
      dayBreakdown.push({
        dayIdx: d,
        dayName: program.days[d].name,
        status: 'skipped',
      });
    } else {
      dayBreakdown.push({
        dayIdx: d,
        dayName: program.days[d].name,
        status: 'todo',
      });
    }
  }
  return { week, totalSets, completedSets, totalVolume, workoutsCompleted, workoutsSkipped, dayBreakdown };
};

// Find all PRs achieved during a specific week
// Returns array of { exerciseId, name, weight, reps, week, dayIdx, prev }
const findWeekPRs = (program, week) => {
  const prs = [];
  for (let d = 0; d < program.days.length; d++) {
    const sKey = `w${week}d${d}`;
    const s = program.sessions?.[sKey];
    if (!s?.completedAt || !s?.log) continue;
    // Use detectPRs to find any PR sets in this session
    const prMap = detectPRs(program, week, d, s.log);
    s.log.forEach((logEx, exIdx) => {
      if (!prMap[exIdx]) return;
      // Take the best (heaviest weight) PR set per exercise
      let best = null;
      Object.entries(prMap[exIdx]).forEach(([setIdx, prInfo]) => {
        if (!best || prInfo.weight > best.weight) {
          best = { ...prInfo, setIdx: parseInt(setIdx) };
        }
      });
      if (best) {
        prs.push({
          exerciseId: logEx.exerciseId,
          name: logEx.name,
          weight: best.weight,
          reps: best.reps,
          prev: best.prev,
          week, dayIdx: d, date: s.date,
        });
      }
    });
  }
  return prs;
};

// Full program retrospective stats
const computeProgramStats = (program) => {
  const weekStats = [];
  let totalVolume = 0, totalCompletedSets = 0, totalWorkouts = 0, totalSkipped = 0;
  const allPRs = [];
  for (let w = 1; w <= program.weeks; w++) {
    const ws = computeWeekStats(program, w);
    weekStats.push(ws);
    totalVolume += ws.totalVolume;
    totalCompletedSets += ws.completedSets;
    totalWorkouts += ws.workoutsCompleted;
    totalSkipped += ws.workoutsSkipped;
    findWeekPRs(program, w).forEach(pr => allPRs.push(pr));
  }
  
  // Build per-exercise top-set progression: { exerciseId: { name, weeks: [{week, topWeight, topReps}, ...] } }
  const exerciseProgression = {};
  for (let w = 1; w <= program.weeks; w++) {
    for (let d = 0; d < program.days.length; d++) {
      const s = program.sessions?.[`w${w}d${d}`];
      if (!s?.completedAt || !s.log) continue;
      s.log.forEach(logEx => {
        if (!exerciseProgression[logEx.exerciseId]) {
          exerciseProgression[logEx.exerciseId] = { name: logEx.name, weeks: {} };
        }
        const completedSets = logEx.sets.filter(set => set.done && set.weight && set.reps);
        if (completedSets.length === 0) return;
        const top = completedSets.reduce((a, b) => parseFloat(b.weight) > parseFloat(a.weight) ? b : a);
        // store the best for the week (may overwrite if exercise appears multiple days)
        const existing = exerciseProgression[logEx.exerciseId].weeks[w];
        if (!existing || parseFloat(top.weight) > parseFloat(existing.weight)) {
          exerciseProgression[logEx.exerciseId].weeks[w] = { weight: top.weight, reps: top.reps };
        }
      });
    }
  }
  
  // Find biggest progression for each exercise (first → last week delta)
  const progressions = Object.entries(exerciseProgression).map(([exId, data]) => {
    const weeksArr = Object.entries(data.weeks).map(([w, v]) => ({ week: parseInt(w), ...v })).sort((a, b) => a.week - b.week);
    if (weeksArr.length < 2) return null;
    const first = weeksArr[0];
    const last = weeksArr[weeksArr.length - 1];
    const firstW = parseFloat(first.weight);
    const lastW = parseFloat(last.weight);
    return {
      exerciseId: exId,
      name: data.name,
      firstWeek: first.week,
      firstWeight: first.weight,
      firstReps: first.reps,
      lastWeek: last.week,
      lastWeight: last.weight,
      lastReps: last.reps,
      deltaPct: firstW > 0 ? ((lastW - firstW) / firstW) * 100 : 0,
      deltaAbs: lastW - firstW,
    };
  }).filter(Boolean).sort((a, b) => b.deltaPct - a.deltaPct);
  
  return {
    weekStats,
    totalVolume,
    totalCompletedSets,
    totalWorkouts,
    totalSkipped,
    allPRs,
    progressions,
  };
};

// PR detection: compare a completed set against best previous for same exerciseId+repCount
// Returns map: { logExIdx: { setIdx: { type: 'weight'|'reps', prev: {...} } } }
const detectPRs = (program, week, dayIdx, log) => {
  const prs = {};
  log.forEach((logEx, exIdx) => {
    logEx.sets.forEach((set, setIdx) => {
      if (!set.done || !set.weight || !set.reps) return;
      const curW = parseFloat(set.weight);
      const curR = parseInt(set.reps);
      if (isNaN(curW) || isNaN(curR)) return;
      
      // Find best previous (any earlier session of any day) for same exerciseId
      let bestEverWeight = null; // best weight at any rep count
      let bestAtSameReps = null; // best weight at same rep count
      
      for (let w = 1; w <= program.weeks; w++) {
        for (let d = 0; d < program.days.length; d++) {
          if (w === week && d === dayIdx) continue;
          const prevSession = program.sessions?.[`w${w}d${d}`];
          if (!prevSession?.completedAt || !prevSession.log) continue;
          prevSession.log.forEach(prevEx => {
            if (prevEx.exerciseId !== logEx.exerciseId) return;
            prevEx.sets.forEach(prevSet => {
              if (!prevSet.done) return;
              const pW = parseFloat(prevSet.weight);
              const pR = parseInt(prevSet.reps);
              if (isNaN(pW) || isNaN(pR)) return;
              if (bestEverWeight === null || pW > bestEverWeight.weight) {
                bestEverWeight = { weight: pW, reps: pR };
              }
              if (pR === curR) {
                if (bestAtSameReps === null || pW > bestAtSameReps.weight) {
                  bestAtSameReps = { weight: pW, reps: pR };
                }
              }
            });
          });
        }
      }
      
      // PR conditions:
      // 1. Heaviest weight ever lifted (any reps)
      // 2. Heaviest weight at this rep count (more nuanced - same reps higher weight)
      // We trigger PR if either: (a) curW > bestEverWeight, OR (b) bestAtSameReps && curW > bestAtSameReps.weight
      let isPR = false;
      let prevBest = null;
      if (bestEverWeight && curW > bestEverWeight.weight) {
        isPR = true;
        prevBest = bestEverWeight;
      } else if (bestAtSameReps && curW > bestAtSameReps.weight) {
        isPR = true;
        prevBest = bestAtSameReps;
      }
      // Don't show PR if there's no prior history at all (first time doing the exercise isn't a PR)
      if (isPR && (bestEverWeight || bestAtSameReps)) {
        if (!prs[exIdx]) prs[exIdx] = {};
        prs[exIdx][setIdx] = { prev: prevBest, weight: curW, reps: curR };
      }
    });
  });
  return prs;
};

// Find best previous set for an exercise+setIdx — used to ghost prefill
const findPrevTopSet = (program, dayIdx, exerciseId) => {
  let best = null;
  for (let w = program.weeks; w >= 1; w--) {
    const s = program.sessions?.[`w${w}d${dayIdx}`];
    if (!s?.completedAt || !s.log) continue;
    const ex = s.log.find(e => e.exerciseId === exerciseId);
    if (!ex) continue;
    // Return the most recent completed session's sets verbatim (best to mirror)
    return ex.sets;
  }
  return null;
};

// ============ EXPORT / IMPORT ============
const downloadFile = (filename, content, mime = 'application/json') => {
  try {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    return true;
  } catch (e) { return false; }
};

const exportJSON = (state) => {
  const payload = { version: 1, exportedAt: new Date().toISOString(), data: state };
  const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
  downloadFile(`lifter-backup-${stamp}.json`, JSON.stringify(payload, null, 2));
};

const exportCSV = (state) => {
  const rows = [['program','week','day','date','exercise','set','weight','reps','rpe','done','notes']];
  state.programs.forEach(p => {
    Object.entries(p.sessions || {}).forEach(([key, session]) => {
      const m = key.match(/^w(\d+)d(\d+)$/);
      if (!m) return;
      const week = m[1];
      const dayIdx = parseInt(m[2]);
      const dayName = p.days[dayIdx]?.name || `Day ${dayIdx + 1}`;
      (session.log || []).forEach(logEx => {
        logEx.sets.forEach((s, i) => {
          rows.push([
            p.name, week, dayName, session.date || '',
            logEx.name, i + 1,
            s.weight || '', s.reps || '', s.rpe || '',
            s.done ? '1' : '0',
            (logEx.notes || '').replace(/[\r\n]+/g, ' '),
          ]);
        });
      });
    });
  });
  const csv = rows.map(r => r.map(cell => {
    const v = String(cell ?? '');
    if (v.includes(',') || v.includes('"') || v.includes('\n')) return '"' + v.replace(/"/g, '""') + '"';
    return v;
  }).join(',')).join('\n');
  const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
  downloadFile(`lifter-sets-${stamp}.csv`, csv, 'text/csv');
};

const importJSON = (file) => new Promise((resolve, reject) => {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const state = parsed.data || parsed;
      if (!state || !Array.isArray(state.programs)) throw new Error('Invalid file');
      resolve(state);
    } catch (e) { reject(e); }
  };
  reader.onerror = () => reject(reader.error);
  reader.readAsText(file);
});

// ============ APP ============
function App() {
  const [state, setState] = useState(loadState);
  const [view, setView] = useState({ name: 'home' });
  const [toast, setToast] = useState(null);
  
  useEffect(() => { saveState(state); }, [state]);
  
  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 1800); };
  
  const updateProgram = (id, updater) => {
    setState(s => ({ ...s, programs: s.programs.map(p => p.id === id ? updater(p) : p) }));
  };
  const addProgram = (program) => {
    const seeded = seedOfficeTemplates({ ...program, templates: program.templates || [] });
    setState(s => ({ ...s, programs: [...s.programs, seeded], activeProgramId: seeded.id }));
  };
  const deleteProgram = (id) => {
    setState(s => ({
      ...s,
      programs: s.programs.filter(p => p.id !== id),
      activeProgramId: s.activeProgramId === id ? null : s.activeProgramId,
    }));
  };
  
  const onWorkoutComplete = (program, summary) => {
    try {
      const payload = { version: 1, exportedAt: new Date().toISOString(), data: state };
      const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-');
      downloadFile(`lifter-autobackup-${stamp}.json`, JSON.stringify(payload));
    } catch {}
  };
  
  let content;
  if (view.name === 'home') {
    content = <Home
      state={state}
      onNewProgram={() => setView({ name: 'builder' })}
      onLoadDefault={() => {
        const prog = buildDefaultProgram();
        addProgram(prog);
        setView({ name: 'program', id: prog.id });
        showToast('PROGRAM LOADED');
      }}
      onOpenProgram={(id) => { setState(s => ({ ...s, activeProgramId: id })); setView({ name: 'program', id }); }}
      onOpenSession={(programId, week, dayIdx) => {
        setState(s => ({ ...s, activeProgramId: programId }));
        setView({ name: 'session', id: programId, week, dayIdx });
      }}
      onSetGymMode={(programId, mode) => updateProgram(programId, p => ({ ...p, gymMode: mode }))}
      onOpenSettings={() => setView({ name: 'settings' })}
    />;
  } else if (view.name === 'settings') {
    content = <Settings
      state={state}
      onBack={() => setView({ name: 'home' })}
      onImport={(newState) => { setState(newState); showToast('IMPORTED'); setView({ name: 'home' }); }}
      onExportJSON={() => { exportJSON(state); showToast('JSON EXPORTED'); }}
      onExportCSV={() => { exportCSV(state); showToast('CSV EXPORTED'); }}
      onResetAll={() => {
        if (confirm('Delete ALL programs and data? This cannot be undone.')) {
          setState({ programs: [], activeProgramId: null });
          setView({ name: 'home' });
          showToast('CLEARED');
        }
      }}
    />;
  } else if (view.name === 'builder') {
    content = <ProgramBuilder
      onCancel={() => setView({ name: 'home' })}
      onSave={(program) => { addProgram(program); setView({ name: 'program', id: program.id }); }}
    />;
  } else if (view.name === 'program') {
    const program = state.programs.find(p => p.id === view.id);
    if (!program) { setView({ name: 'home' }); return null; }
    content = <ProgramView
      program={program}
      onBack={() => setView({ name: 'home' })}
      onOpenSession={(week, dayIdx) => setView({ name: 'session', id: view.id, week, dayIdx })}
      onOpenPastSession={(week, dayIdx) => setView({ name: 'pastSession', id: view.id, week, dayIdx })}
      onProgression={() => setView({ name: 'progression', id: view.id })}
      onEdit={() => setView({ name: 'editProgram', id: view.id })}
      onSetGymMode={(mode) => updateProgram(view.id, p => ({ ...p, gymMode: mode }))}
      onDelete={() => { deleteProgram(view.id); setView({ name: 'home' }); }}
    />;
  } else if (view.name === 'session') {
    const program = state.programs.find(p => p.id === view.id);
    if (!program) { setView({ name: 'home' }); return null; }
    content = <SessionView
      program={program}
      week={view.week}
      dayIdx={view.dayIdx}
      onBack={() => setView({ name: 'program', id: view.id })}
      onUpdate={(updater) => updateProgram(view.id, updater)}
      onComplete={(summary) => { onWorkoutComplete(program, summary); setView({ name: 'summary', id: view.id, week: view.week, dayIdx: view.dayIdx, summary }); }}
      showToast={showToast}
    />;
  } else if (view.name === 'summary') {
    content = <SummaryView
      summary={view.summary}
      onDone={(toSkip) => {
        // Apply skips (if any) and compute next destination synchronously using the post-skip projection
        const program = state.programs.find(p => p.id === view.id);
        if (!program) { setView({ name: 'home' }); return; }
        
        // Build the effective sessions map as it WILL be after the skip update
        const effectiveSessions = { ...program.sessions };
        (toSkip || []).forEach(c => {
          const k = `w${c.week}d${c.dayIdx}`;
          effectiveSessions[k] = { ...effectiveSessions[k], skipped: true };
        });
        
        const isResolved = (w, d) => {
          const s = effectiveSessions[`w${w}d${d}`];
          return !!(s?.completedAt || s?.skipped);
        };
        
        // Check program-level completion
        let allDone = true;
        outer: for (let w = 1; w <= program.weeks; w++) {
          for (let d = 0; d < program.days.length; d++) {
            if (!isResolved(w, d)) { allDone = false; break outer; }
          }
        }
        
        // Check week-level completion
        const wk = view.summary.week;
        let weekDone = true;
        for (let d = 0; d < program.days.length; d++) {
          if (!isResolved(wk, d)) { weekDone = false; break; }
        }
        
        // Apply skips to state
        if (toSkip && toSkip.length > 0) {
          updateProgram(view.id, p => {
            const newSessions = { ...p.sessions };
            toSkip.forEach(c => {
              const k = `w${c.week}d${c.dayIdx}`;
              newSessions[k] = { ...newSessions[k], skipped: true };
            });
            return { ...p, sessions: newSessions };
          });
        }
        
        // Route to most-specific applicable summary
        if (allDone) {
          setView({ name: 'programSummary', id: view.id });
        } else if (weekDone) {
          setView({ name: 'weekSummary', id: view.id, week: wk });
        } else {
          setView({ name: 'program', id: view.id });
        }
      }}
    />;
  } else if (view.name === 'weekSummary') {
    const program = state.programs.find(p => p.id === view.id);
    if (!program) { setView({ name: 'home' }); return null; }
    content = <WeekSummaryView
      program={program}
      week={view.week}
      onDone={() => {
        // After week summary, check if program is also done
        let allDone = true;
        outer: for (let w = 1; w <= program.weeks; w++) {
          for (let d = 0; d < program.days.length; d++) {
            const s = program.sessions?.[`w${w}d${d}`];
            if (!(s?.completedAt || s?.skipped)) { allDone = false; break outer; }
          }
        }
        if (allDone) setView({ name: 'programSummary', id: view.id });
        else setView({ name: 'program', id: view.id });
      }}
    />;
  } else if (view.name === 'programSummary') {
    const program = state.programs.find(p => p.id === view.id);
    if (!program) { setView({ name: 'home' }); return null; }
    content = <ProgramSummaryView
      program={program}
      onDone={() => setView({ name: 'program', id: view.id })}
    />;
  } else if (view.name === 'pastSession') {
    const program = state.programs.find(p => p.id === view.id);
    if (!program) { setView({ name: 'home' }); return null; }
    content = <PastSessionView
      program={program}
      week={view.week}
      dayIdx={view.dayIdx}
      onBack={() => setView({ name: 'program', id: view.id })}
      onReopen={() => {
        // Re-open the session live: clear completedAt and go to session view
        updateProgram(view.id, p => ({
          ...p,
          sessions: { ...p.sessions, [`w${view.week}d${view.dayIdx}`]: { ...p.sessions?.[`w${view.week}d${view.dayIdx}`], completedAt: null } }
        }));
        setView({ name: 'session', id: view.id, week: view.week, dayIdx: view.dayIdx });
      }}
    />;
  } else if (view.name === 'progression') {
    const program = state.programs.find(p => p.id === view.id);
    if (!program) { setView({ name: 'home' }); return null; }
    content = <ProgressionView program={program} onBack={() => setView({ name: 'program', id: view.id })} />;
  } else if (view.name === 'editProgram') {
    const program = state.programs.find(p => p.id === view.id);
    if (!program) { setView({ name: 'home' }); return null; }
    content = <ProgramBuilder
      existing={program}
      onCancel={() => setView({ name: 'program', id: view.id })}
      onSave={(updated) => { updateProgram(view.id, () => updated); setView({ name: 'program', id: view.id }); }}
    />;
  }
  
  return <>{content}{toast && <div className="toast">{toast}</div>}</>;
}

// ============ HOME (HYBRID: continue card + program list) ============
function Home({ state, onNewProgram, onLoadDefault, onOpenProgram, onOpenSession, onSetGymMode, onOpenSettings }) {
  const stats = useMemo(() => computeGlobalStats(state), [state]);
  
  // Find the "active" program: the one with activeProgramId, or the most recently created
  const activeProgram = useMemo(() => {
    if (state.activeProgramId) {
      const p = state.programs.find(p => p.id === state.activeProgramId);
      if (p) return p;
    }
    return state.programs[state.programs.length - 1] || null;
  }, [state]);
  
  // Find next session in active program.
  // Priority: (1) any in-progress (has logged sets but no completedAt), (2) earliest non-completed non-skipped.
  const nextSession = useMemo(() => {
    if (!activeProgram) return null;
    
    let inProgress = null;
    let earliestTodo = null;
    
    for (let w = 1; w <= activeProgram.weeks; w++) {
      for (let d = 0; d < activeProgram.days.length; d++) {
        const s = activeProgram.sessions?.[`w${w}d${d}`];
        if (s?.completedAt) continue;
        if (s?.skipped) continue;
        const hasProgress = !!s?.log?.some(ex => ex.sets.some(set => set.done));
        if (hasProgress && !inProgress) {
          inProgress = { week: w, dayIdx: d, day: activeProgram.days[d], hasProgress: true };
        }
        if (!earliestTodo) {
          earliestTodo = { week: w, dayIdx: d, day: activeProgram.days[d], hasProgress };
        }
      }
    }
    
    return inProgress || earliestTodo;
  }, [activeProgram]);
  
  return (
    <div className="app">
      <div className="header">
        <div style={{width:60}}></div>
        <div className="header-title"><strong>Lifter</strong></div>
        <button className="back-btn" onClick={onOpenSettings} style={{fontSize:18}}>⚙</button>
      </div>
      <div className="content content-tight">
        {state.programs.length === 0 ? (
          <>
            <div className="home-brand">Lifter</div>
            <div className="home-brand-line">v1 · LOCAL ONLY</div>
            <div className="empty">
              <div className="empty-icon">∅</div>
              <div className="empty-text">No programs yet</div>
            </div>
            <button className="btn-primary" onClick={onLoadDefault} style={{ marginBottom: 12 }}>
              ▶ Load My Program
            </button>
            <button className="btn-secondary" onClick={onNewProgram}>+ Build From Scratch</button>
          </>
        ) : (
          <>
            <div className="home-brand">Lifter</div>
            <div className="home-brand-line">v1 · LOCAL ONLY</div>
            
            {/* Stats */}
            <div className="stats-strip">
              <div className="stat-cell">
                <div className={`stat-value ${stats.streak === 0 ? 'zero' : ''}`}>{stats.streak}</div>
                <div className="stat-label">Streak</div>
              </div>
              <div className="stat-cell">
                <div className={`stat-value ${stats.totalCompleted === 0 ? 'zero' : ''}`}>{stats.totalCompleted}</div>
                <div className="stat-label">Workouts</div>
              </div>
              <div className="stat-cell">
                <div className={`stat-value ${stats.totalWeeks === 0 ? 'zero' : ''}`}>{stats.totalWeeks}</div>
                <div className="stat-label">Weeks</div>
              </div>
            </div>
            
            {/* CONTINUE CARD — the hero */}
            {activeProgram && nextSession && (
              <div className="continue-card">
                <div className="continue-top-row">
                  <div className="continue-eyebrow">{nextSession.hasProgress ? 'Continue' : 'Up Next'}</div>
                  <div className="gym-pill" role="group" aria-label="Gym mode">
                    <button
                      className={`gym-pill-opt ${activeProgram.gymMode !== 'office' ? 'active-main' : ''}`}
                      onClick={(e) => { e.stopPropagation(); onSetGymMode(activeProgram.id, 'main'); }}
                    >MAIN</button>
                    <button
                      className={`gym-pill-opt ${activeProgram.gymMode === 'office' ? 'active-office' : ''}`}
                      onClick={(e) => { e.stopPropagation(); onSetGymMode(activeProgram.id, 'office'); }}
                    >OFFICE</button>
                  </div>
                </div>
                <div
                  className="continue-tap-area"
                  onClick={() => onOpenSession(activeProgram.id, nextSession.week, nextSession.dayIdx)}
                  role="button"
                  tabIndex={0}
                >
                  <div className="continue-week">Week {nextSession.week} / {activeProgram.weeks} · {activeProgram.name}</div>
                  <div className="continue-day">{nextSession.day.name}</div>
                  <div className="continue-detail">
                    {nextSession.day.exercises.length} exercises
                  </div>
                  <div className="continue-cta">Start Workout →</div>
                </div>
              </div>
            )}
            {activeProgram && !nextSession && (
              <div className="continue-card continue-card-done" style={{ textAlign: 'center' }}>
                <div className="continue-eyebrow" style={{ color: 'var(--success)' }}>Complete</div>
                <div className="continue-day" style={{ fontSize: 32 }}>Program Finished</div>
                <div className="continue-detail">All {activeProgram.weeks * activeProgram.days.length} sessions logged. Nice work.</div>
              </div>
            )}
            
            {/* All programs */}
            <div className="section-heading">All Programs</div>
            {state.programs.map(p => {
              const totalSessions = p.weeks * p.days.length;
              const doneSessions = Object.values(p.sessions || {}).filter(s => s.completedAt).length;
              const skippedSessions = Object.values(p.sessions || {}).filter(s => s.skipped && !s.completedAt).length;
              const resolvedSessions = doneSessions + skippedSessions;
              const pct = totalSessions ? resolvedSessions / totalSessions : 0;
              return (
                <button key={p.id} className="program-card" onClick={() => onOpenProgram(p.id)}>
                  <div className="program-card-header">
                    <div>
                      <div className="program-name">{p.name}</div>
                      <div className="program-meta">{p.weeks} WK · {p.days.length} DAY/WK {p.gymMode === 'office' && <span className="badge-office">OFC</span>}</div>
                    </div>
                    {doneSessions === 0 && <span className="program-tag">NEW</span>}
                    {resolvedSessions === totalSessions && doneSessions > 0 && <span className="program-tag" style={{background:'var(--success)'}}>DONE</span>}
                  </div>
                  <div className="program-progress">
                    <div className="progress-bar"><div className="progress-bar-fill" style={{ transform: `scaleX(${pct})` }} /></div>
                    <span>{doneSessions}/{totalSessions}{skippedSessions > 0 ? ` · ${skippedSessions} skip` : ''}</span>
                  </div>
                </button>
              );
            })}
          </>
        )}
      </div>
      {state.programs.length > 0 && (
        <div className="fab">
          <button className="btn-secondary" onClick={onNewProgram}>+ New Program</button>
        </div>
      )}
    </div>
  );
}

// ============ SETTINGS ============
function Settings({ state, onBack, onImport, onExportJSON, onExportCSV, onResetAll }) {
  const fileInputRef = useRef(null);
  const [importing, setImporting] = useState(false);
  const totalSets = useMemo(() => {
    let n = 0;
    state.programs.forEach(p => Object.values(p.sessions || {}).forEach(s => {
      (s.log || []).forEach(ex => ex.sets.forEach(set => { if (set.done) n++; }));
    }));
    return n;
  }, [state]);
  
  const handleImport = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setImporting(true);
    try {
      const newState = await importJSON(file);
      if (state.programs.length > 0 && !confirm(`Replace your current ${state.programs.length} program(s) with the imported data?`)) {
        setImporting(false); e.target.value = ''; return;
      }
      onImport(newState);
    } catch (err) {
      alert('Could not import: ' + err.message);
    } finally {
      setImporting(false); e.target.value = '';
    }
  };
  
  return (
    <div className="app">
      <div className="header">
        <button className="back-btn" onClick={onBack}>← BACK</button>
        <div className="header-title">SETTINGS</div>
        <div style={{ width: 60 }}></div>
      </div>
      <div className="content">
        <div className="form-group">
          <div className="form-label">Data Stats</div>
          <div style={{ background: 'var(--surface)', border: '1px solid var(--border)', padding: 16 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
              <span className="text-dim mono" style={{fontSize:12, letterSpacing:'0.1em'}}>Programs</span>
              <span className="mono">{state.programs.length}</span>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between' }}>
              <span className="text-dim mono" style={{fontSize:12, letterSpacing:'0.1em'}}>Sets logged</span>
              <span className="mono">{totalSets}</span>
            </div>
          </div>
        </div>
        
        <div className="form-group">
          <div className="form-label">Backup</div>
          <button className="btn-secondary" style={{ marginBottom: 8 }} onClick={onExportJSON}>↓ Export JSON (Full Backup)</button>
          <button className="btn-secondary" style={{ marginBottom: 8 }} onClick={onExportCSV}>↓ Export CSV (Sets Only)</button>
          <div className="text-faint mono" style={{ fontSize: 11, marginTop: 8, letterSpacing: '0.05em', lineHeight: 1.6 }}>
            JSON is a full backup you can re-import. CSV is a readable spreadsheet of every set logged.
          </div>
        </div>
        
        <div className="form-group">
          <div className="form-label">Restore</div>
          <input ref={fileInputRef} type="file" accept=".json,application/json" style={{ display: 'none' }} onChange={handleImport} />
          <button className="btn-secondary" onClick={() => fileInputRef.current?.click()} disabled={importing}>↑ Import JSON Backup</button>
        </div>
        
        <div className="form-group">
          <div className="form-label">Auto-Backup</div>
          <div className="text-faint mono" style={{ fontSize: 11, letterSpacing: '0.05em', lineHeight: 1.6 }}>
            A JSON file is downloaded automatically when you complete a workout. On iPhone, these save to your Files app under Downloads.
          </div>
        </div>
        
        <div className="divider"></div>
        
        <button className="btn-secondary" onClick={onResetAll} style={{ color: 'var(--danger)', borderColor: 'var(--danger)' }}>
          Delete All Data
        </button>
      </div>
    </div>
  );
}

// ============ PROGRAM BUILDER ============
function ProgramBuilder({ existing, onCancel, onSave }) {
  const [name, setName] = useState(existing?.name || '');
  const [weeks, setWeeks] = useState(existing?.weeks || 8);
  const [days, setDays] = useState(existing?.days || [{ id: uid(), name: 'Day A', exercises: [] }]);
  const [activeDayIdx, setActiveDayIdx] = useState(0);
  const [libModal, setLibModal] = useState(false);
  const [exerciseModal, setExerciseModal] = useState(null);
  
  const addDay = () => {
    const letter = String.fromCharCode(65 + days.length);
    setDays([...days, { id: uid(), name: `Day ${letter}`, exercises: [] }]);
    setActiveDayIdx(days.length);
  };
  const removeDay = (idx) => {
    if (days.length <= 1) return;
    const newDays = days.filter((_, i) => i !== idx);
    setDays(newDays);
    setActiveDayIdx(Math.min(activeDayIdx, newDays.length - 1));
  };
  const updateDayName = (idx, name) => setDays(days.map((d, i) => i === idx ? { ...d, name } : d));
  
  const addExerciseFromLib = (libExercise) => {
    const newEx = { id: uid(), name: libExercise.name, sets: 3, repsMin: 8, repsMax: 12, rest: 90 };
    setDays(days.map((d, i) => i === activeDayIdx ? { ...d, exercises: [...d.exercises, newEx] } : d));
    setLibModal(false);
    setExerciseModal({ dayIdx: activeDayIdx, exIdx: days[activeDayIdx].exercises.length });
  };
  
  const updateExercise = (dayIdx, exIdx, patch) => {
    setDays(days.map((d, i) => i !== dayIdx ? d : { ...d, exercises: d.exercises.map((e, j) => j === exIdx ? { ...e, ...patch } : e) }));
  };
  const removeExercise = (dayIdx, exIdx) => {
    setDays(days.map((d, i) => i !== dayIdx ? d : { ...d, exercises: d.exercises.filter((_, j) => j !== exIdx) }));
  };
  
  const canSave = name.trim() && days.every(d => d.exercises.length > 0);
  
  const handleSave = () => {
    if (!canSave) return;
    onSave({
      id: existing?.id || uid(), name: name.trim(), weeks, days,
      createdAt: existing?.createdAt || new Date().toISOString(),
      sessions: existing?.sessions || {},
      gymMode: existing?.gymMode || 'main',
    });
  };
  
  const activeDay = days[activeDayIdx];
  
  return (
    <div className="app">
      <div className="header">
        <button className="back-btn" onClick={onCancel}>← CANCEL</button>
        <div className="header-title">{existing ? 'EDIT' : 'NEW PROGRAM'}</div>
        <button className="back-btn" style={{ color: canSave ? 'var(--accent)' : 'var(--text-faint)' }} disabled={!canSave} onClick={handleSave}>SAVE →</button>
      </div>
      <div className="content">
        <div className="form-group">
          <label className="form-label">Program Name</label>
          <input className="form-input" value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Hypertrophy Block 1" />
        </div>
        
        <div className="form-group">
          <label className="form-label">Duration</label>
          <div className="seg">
            <button className={`seg-opt ${weeks === 6 ? 'active' : ''}`} onClick={() => setWeeks(6)}>6 WEEKS</button>
            <button className={`seg-opt ${weeks === 8 ? 'active' : ''}`} onClick={() => setWeeks(8)}>8 WEEKS</button>
          </div>
        </div>
        
        <div className="divider"></div>
        
        <div className="form-group">
          <label className="form-label">Training Days ({days.length})</label>
          <div className="day-tabs">
            {days.map((d, i) => (
              <button key={d.id} className={`day-tab ${i === activeDayIdx ? 'active' : ''}`} onClick={() => setActiveDayIdx(i)}>
                {d.name.toUpperCase()}
              </button>
            ))}
            {days.length < 7 && <button className="day-tab" onClick={addDay} style={{ color: 'var(--accent)' }}>+ ADD</button>}
          </div>
          
          <input className="form-input" value={activeDay.name} onChange={e => updateDayName(activeDayIdx, e.target.value)} placeholder="Day name" style={{ marginBottom: 12 }} />
          
          {activeDay.exercises.map((ex, i) => (
            <div key={ex.id} className="exercise-row" onClick={() => setExerciseModal({ dayIdx: activeDayIdx, exIdx: i })}>
              <div className="exercise-row-handle">{i + 1}</div>
              <div className="exercise-row-main">
                <div className="exercise-row-name">{ex.name}</div>
                <div className="exercise-row-detail">
                  {ex.sets} × {ex.repsMin === ex.repsMax ? ex.repsMax : `${ex.repsMin}–${ex.repsMax}`} · {ex.rest}s
                </div>
              </div>
              <button className="exercise-row-del" onClick={(e) => { e.stopPropagation(); removeExercise(activeDayIdx, i); }}>×</button>
            </div>
          ))}
          
          <button className="add-exercise-btn" onClick={() => setLibModal(true)}>+ ADD EXERCISE</button>
          
          {days.length > 1 && (
            <button className="btn-ghost" style={{ width: '100%', marginTop: 16, color: 'var(--danger)' }} onClick={() => removeDay(activeDayIdx)}>
              Remove {activeDay.name}
            </button>
          )}
        </div>
      </div>
      
      {libModal && <ExerciseLibraryModal onPick={addExerciseFromLib} onClose={() => setLibModal(false)} onAddCustom={(n) => addExerciseFromLib({ name: n })} />}
      {exerciseModal && (
        <ExerciseEditModal
          exercise={days[exerciseModal.dayIdx].exercises[exerciseModal.exIdx]}
          onSave={(patch) => { updateExercise(exerciseModal.dayIdx, exerciseModal.exIdx, patch); setExerciseModal(null); }}
          onClose={() => setExerciseModal(null)}
        />
      )}
    </div>
  );
}
