// ============ PROGRAM VIEW ============
function ProgramView({ program, onBack, onOpenSession, onOpenPastSession, onProgression, onEdit, onSetGymMode, onDelete }) {
  const [menu, setMenu] = useState(false);
  const gymMode = program.gymMode || 'main';
  
  const sessionKey = (week, dayIdx) => `w${week}d${dayIdx}`;
  const getSession = (week, dayIdx) => program.sessions?.[sessionKey(week, dayIdx)];
  
  const findNext = () => {
    let inProgress = null;
    let earliestTodo = null;
    for (let w = 1; w <= program.weeks; w++) {
      for (let d = 0; d < program.days.length; d++) {
        const s = getSession(w, d);
        if (s?.completedAt) continue;
        if (s?.skipped) continue;
        const hasProgress = !!s?.log?.some(ex => ex.sets.some(set => set.done));
        if (hasProgress && !inProgress) inProgress = { week: w, dayIdx: d };
        if (!earliestTodo) earliestTodo = { week: w, dayIdx: d };
      }
    }
    return inProgress || earliestTodo;
  };
  const next = findNext();
  
  return (
    <div className="app">
      <div className="header">
        <button className="back-btn" onClick={onBack}>← BACK</button>
        <div className="header-title">PROGRAM</div>
        <button className="back-btn" onClick={() => setMenu(true)} style={{fontSize:18}}>⋯</button>
      </div>
      <div className="content">
        <div style={{ fontFamily: 'var(--display)', fontStyle: 'italic', fontWeight: 900, fontSize: 36, marginBottom: 4, letterSpacing: '-0.02em' }}>{program.name}</div>
        <div className="program-meta" style={{ marginBottom: 20 }}>{program.weeks} WEEKS · {program.days.length} DAYS/WK</div>
        
        <div className="form-group">
          <label className="form-label">Gym Mode</label>
          <div className="seg">
            <button className={`seg-opt ${gymMode === 'main' ? 'active' : ''}`} onClick={() => onSetGymMode('main')}>MAIN</button>
            <button className={`seg-opt ${gymMode === 'office' ? 'active-office' : ''}`} onClick={() => onSetGymMode('office')}>OFFICE</button>
          </div>
          <div className="text-faint mono" style={{ fontSize: 10, marginTop: 6, letterSpacing: '0.05em' }}>
            {gymMode === 'office' ? 'Exercises auto-swap to office-friendly variants' : 'Using main gym exercises as programmed'}
          </div>
        </div>
        
        <button className="btn-secondary" onClick={onProgression} style={{ marginBottom: 24 }}>View Progression →</button>
        
        {Array.from({ length: program.weeks }, (_, w) => w + 1).map(week => (
          <div key={week} className="history-week">
            <div className="history-week-title">Week {week}</div>
            {program.days.map((day, dIdx) => {
              const session = getSession(week, dIdx);
              const isNext = next && next.week === week && next.dayIdx === dIdx;
              let status = 'todo';
              let statusText = isNext ? 'NEXT' : 'TODO';
              if (session?.completedAt) { status = 'done'; statusText = 'DONE'; }
              else if (session?.skipped) { status = 'skipped'; statusText = 'SKIPPED'; }
              else if (session?.log?.some(ex => ex.sets.some(s => s.done))) { status = 'partial'; statusText = 'IN PROG'; }
              return (
                <button key={dIdx} className="history-day" style={{ width: '100%', background: 'transparent', textAlign: 'left' }} onClick={() => session?.completedAt ? onOpenPastSession(week, dIdx) : onOpenSession(week, dIdx)}>
                  <div>
                    <div className="history-day-name">{day.name}{session?.gymMode === 'office' && <span className="badge-office">OFC</span>}</div>
                    <div className="history-day-meta">{session?.date ? fmtDate(session.date) : `${day.exercises.length} exercises`}</div>
                  </div>
                  <div className={`history-day-status ${isNext && status === 'todo' ? 'status-next' : 'status-' + status}`}>
                    {statusText}
                  </div>
                </button>
              );
            })}
          </div>
        ))}
      </div>
      
      {next && (
        <div className="fab">
          <button className="btn-primary" onClick={() => onOpenSession(next.week, next.dayIdx)}>
            ▶ Start W{next.week} · {program.days[next.dayIdx].name}
          </button>
        </div>
      )}
      
      {menu && (
        <div className="modal-backdrop" onClick={() => setMenu(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-title">PROGRAM OPTIONS</div>
            <button className="menu-item" onClick={() => { setMenu(false); onEdit(); }}>Edit Program <span className="arrow">→</span></button>
            <button className="menu-item danger" onClick={() => {
              if (confirm('Delete this program and all its data? This cannot be undone.')) onDelete();
            }}>Delete Program <span className="arrow">→</span></button>
            <button className="btn-ghost" style={{ width: '100%', marginTop: 16 }} onClick={() => setMenu(false)}>Close</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ============ SESSION VIEW ============
function SessionView({ program, week, dayIdx, onBack, onUpdate, onComplete, showToast }) {
  const sessionKey = `w${week}d${dayIdx}`;
  const day = program.days[dayIdx];
  const existing = program.sessions?.[sessionKey];
  const sessionGymMode = existing?.gymMode || program.gymMode || 'main';
  
  const initialLog = useMemo(() => {
    if (existing?.log) return existing.log;
    const exs = day.exercises.map(ex => {
      if (sessionGymMode === 'office') {
        const swap = getOfficeSwap(ex.name);
        if (swap) return { ...ex, name: swap, _originalName: ex.name };
      }
      return ex;
    });
    return buildSessionLog(exs);
  }, [day.exercises, sessionGymMode, existing]);
  
  const [log, setLog] = useState(initialLog);
  const [date, setDate] = useState(existing?.date || today());
  const [subModal, setSubModal] = useState(null);
  const [editModal, setEditModal] = useState(null);
  const [timer, setTimer] = useState(null);
  // isLive: true once the user has tapped START in this session-view visit.
  // Until then, exercises render in preview mode (disabled inputs, no elapsed timer).
  const [isLive, setIsLive] = useState(false);
  const [startTime, setStartTime] = useState(null);
  const [, setTick] = useState(0);
  // Manual expand overrides for completed exercises. Keyed by exercise index.
  // If an exercise's index is in this set, it overrides auto-collapse (forces expanded).
  const [manuallyExpanded, setManuallyExpanded] = useState(() => new Set());
  // Refs for scroll-into-view from the jump bar
  const exerciseRefs = useRef({});
  // Kebab menu and child modals
  const [sessionMenu, setSessionMenu] = useState(false);
  const [applyTemplateModal, setApplyTemplateModal] = useState(false);
  const [saveTemplateModal, setSaveTemplateModal] = useState(false);
  const [copyEditsModal, setCopyEditsModal] = useState(false);
  
  // Track PRs hit this session in real-time
  const prMap = useMemo(() => detectPRs(program, week, dayIdx, log), [program, week, dayIdx, log]);
  
  // Previous session of this dayIdx for ghost-prefill
  const prevSession = useMemo(() => {
    for (let w = week - 1; w >= 1; w--) {
      const s = program.sessions?.[`w${w}d${dayIdx}`];
      if (s?.completedAt) return s;
    }
    return null;
  }, [program.sessions, week, dayIdx]);
  
  // Persist log/date/gymMode changes immediately, including pre-start configuration
  // (substitutions, edits to sets/reps/rest). The 'live' state itself isn't persisted
  // — it's a per-visit flag that defaults to false so the user always sees the start gate.
  useEffect(() => {
    onUpdate(p => ({
      ...p,
      sessions: { ...p.sessions, [sessionKey]: { ...p.sessions?.[sessionKey], log, date, gymMode: sessionGymMode, startedAt: p.sessions?.[sessionKey]?.startedAt || (isLive ? startTime : undefined) } }
    }));
  }, [log, date, isLive]);
  
  useEffect(() => {
    if (!timer) return;
    const id = setInterval(() => setTick(t => t + 1), 250);
    return () => clearInterval(id);
  }, [timer]);
  
  const timerRemaining = timer ? Math.max(0, Math.ceil((timer.endsAt - Date.now()) / 1000)) : 0;
  const timerDone = timer && timerRemaining === 0;
  const timerProgress = timer ? Math.min(100, ((Date.now() - timer.startedAt) / (timer.endsAt - timer.startedAt)) * 100) : 0;
  
  useEffect(() => {
    if (timer && timerDone && !timer._notified) {
      if (navigator.vibrate) navigator.vibrate([200, 80, 200, 80, 200]);
      timer._notified = true;
      // auto-clear after 4 seconds
      setTimeout(() => setTimer(curr => curr === timer ? null : curr), 4000);
    }
  }, [timerDone, timer]);
  
  // Glance stats
  const glance = useMemo(() => {
    let total = 0, done = 0;
    log.forEach(ex => ex.sets.forEach(s => { total++; if (s.done) done++; }));
    const remaining = total - done;
    const elapsed = (isLive && startTime) ? Math.floor((Date.now() - startTime) / 60000) : 0;
    return { total, done, remaining, elapsed };
  }, [log, startTime, isLive, /* re-eval on tick if a timer is going */ timer]);
  
  // Per-exercise status: 'complete' | 'partial' | 'untouched'
  // upNextIdx = first exercise (top-down) that isn't complete (untouched or partial)
  const exerciseStatuses = useMemo(() => {
    const out = log.map(ex => {
      const totalSets = ex.sets.length;
      const doneSets = ex.sets.filter(s => s.done).length;
      if (doneSets === 0) return { status: 'untouched', doneSets, totalSets };
      if (doneSets === totalSets) return { status: 'complete', doneSets, totalSets };
      return { status: 'partial', doneSets, totalSets };
    });
    return out;
  }, [log]);
  
  const upNextIdx = useMemo(() => {
    return exerciseStatuses.findIndex(s => s.status !== 'complete');
  }, [exerciseStatuses]);
  
  const isExpanded = (exIdx) => {
    const s = exerciseStatuses[exIdx];
    if (!s) return true;
    // Complete exercises are auto-collapsed UNLESS user manually expanded them
    if (s.status === 'complete') return manuallyExpanded.has(exIdx);
    // Non-complete (untouched/partial) — always expanded
    return true;
  };
  
  const toggleExpanded = (exIdx) => {
    setManuallyExpanded(prev => {
      const next = new Set(prev);
      if (next.has(exIdx)) next.delete(exIdx);
      else next.add(exIdx);
      return next;
    });
  };
  
  const scrollToExercise = (exIdx) => {
    const el = exerciseRefs.current[exIdx];
    if (el && el.scrollIntoView) {
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (navigator.vibrate) navigator.vibrate(15);
    }
  };
  
  const updateSet = (exIdx, setIdx, patch) => {
    setLog(log.map((ex, i) => i !== exIdx ? ex : { ...ex, sets: ex.sets.map((s, j) => j === setIdx ? { ...s, ...patch } : s) }));
  };
  
  const toggleSetDone = (exIdx, setIdx) => {
    const set = log[exIdx].sets[setIdx];
    const willBeDone = !set.done;
    // If marking done but no values entered, try to pre-fill from previous session
    let valuePatch = { done: willBeDone };
    if (willBeDone && !set.weight && !set.reps && prevSession) {
      const prevEx = prevSession.log?.find(e => e.exerciseId === log[exIdx].exerciseId);
      const prevSet = prevEx?.sets?.[setIdx];
      if (prevSet?.weight && prevSet?.reps) {
        valuePatch.weight = prevSet.weight;
        valuePatch.reps = prevSet.reps;
      }
    }
    updateSet(exIdx, setIdx, valuePatch);
    if (willBeDone) {
      const baseEx = day.exercises.find(e => e.id === log[exIdx].exerciseId);
      const rest = log[exIdx].prescription?.rest ?? baseEx?.rest ?? 90;
      if (rest > 0) {
        setTimer({ startedAt: Date.now(), endsAt: Date.now() + rest * 1000, total: rest });
        if (navigator.vibrate) navigator.vibrate(40);
      }
    }
  };
  
  // Commit a ghost value (tap empty input to fill from prev)
  const commitGhost = (exIdx, setIdx, field, ghostVal) => {
    if (!ghostVal) return;
    updateSet(exIdx, setIdx, { [field]: String(ghostVal) });
    if (navigator.vibrate) navigator.vibrate(20);
  };
  
  const addSet = (exIdx) => setLog(log.map((ex, i) => i === exIdx ? { ...ex, sets: [...ex.sets, blankSet()] } : ex));
  const removeSet = (exIdx, setIdx) => {
    setLog(log.map((ex, i) => i !== exIdx ? ex : (ex.sets.length <= 1 ? ex : { ...ex, sets: ex.sets.filter((_, j) => j !== setIdx) })));
  };
  
  const substituteExercise = (exIdx, newName, scope) => {
    setLog(log.map((ex, i) => i === exIdx ? { ...ex, name: newName } : ex));
    if (scope === 'program') {
      const targetId = log[exIdx].exerciseId;
      onUpdate(p => ({
        ...p,
        days: p.days.map((d, di) => di === dayIdx ? { ...d, exercises: d.exercises.map(e => e.id === targetId ? { ...e, name: newName } : e) } : d)
      }));
    }
    setSubModal(null);
  };
  
  const editPrescription = (exIdx, patch) => {
    if (patch.sets && patch.sets !== log[exIdx].sets.length) {
      const diff = patch.sets - log[exIdx].sets.length;
      setLog(log.map((ex, i) => {
        if (i !== exIdx) return ex;
        if (diff > 0) return { ...ex, sets: [...ex.sets, ...Array.from({ length: diff }, () => blankSet())], prescription: patch };
        return { ...ex, sets: ex.sets.slice(0, patch.sets), prescription: patch };
      }));
    } else {
      setLog(log.map((ex, i) => i === exIdx ? { ...ex, prescription: patch } : ex));
    }
    setEditModal(null);
  };
  
  const completeWorkout = () => {
    if (!confirm('Complete this workout? A backup will be downloaded automatically.')) return;
    
    // Build summary
    let totalSets = 0, completedSets = 0, totalVolume = 0;
    const prList = [];
    log.forEach((logEx, exIdx) => {
      logEx.sets.forEach((s, setIdx) => {
        totalSets++;
        if (s.done) {
          completedSets++;
          const w = parseFloat(s.weight) || 0;
          const r = parseInt(s.reps) || 0;
          totalVolume += w * r;
          if (prMap[exIdx]?.[setIdx]) {
            const existing = prList.find(p => p.exerciseId === logEx.exerciseId);
            const prInfo = prMap[exIdx][setIdx];
            if (!existing || prInfo.weight > existing.weight) {
              if (existing) {
                existing.weight = prInfo.weight;
                existing.reps = prInfo.reps;
                existing.prev = prInfo.prev;
              } else {
                prList.push({
                  exerciseId: logEx.exerciseId,
                  name: logEx.name,
                  weight: prInfo.weight,
                  reps: prInfo.reps,
                  prev: prInfo.prev,
                });
              }
            }
          }
        }
      });
    });
    const durationMin = (isLive && startTime) ? Math.max(1, Math.round((Date.now() - startTime) / 60000)) : 0;
    
    // Detect end-of-week skip candidates:
    // If after completing this session, all later days in the same week are also complete,
    // then check for earlier days in this week (lower dayIdx) that are unfinished and not yet skipped.
    const skipCandidates = [];
    const allLaterDone = program.days.every((_, otherIdx) => {
      if (otherIdx <= dayIdx) return true; // earlier or this one — skip the check
      const otherS = program.sessions?.[`w${week}d${otherIdx}`];
      return !!otherS?.completedAt; // later days must be already completed
    });
    if (allLaterDone) {
      for (let d = 0; d < dayIdx; d++) {
        const s = program.sessions?.[`w${week}d${d}`];
        if (!s?.completedAt && !s?.skipped) {
          skipCandidates.push({ week, dayIdx: d, dayName: program.days[d].name });
        }
      }
      // Also pull in any unfinished from previous weeks
      for (let w = 1; w < week; w++) {
        for (let d = 0; d < program.days.length; d++) {
          const s = program.sessions?.[`w${w}d${d}`];
          if (!s?.completedAt && !s?.skipped) {
            skipCandidates.push({ week: w, dayIdx: d, dayName: program.days[d].name });
          }
        }
      }
    }
    
    const summary = {
      dayName: day.name, week, totalSets, completedSets, totalVolume,
      prs: prList, durationMin, date,
      skipCandidates, programId: program.id,
    };
    
    onUpdate(p => ({
      ...p,
      sessions: { ...p.sessions, [sessionKey]: { ...p.sessions?.[sessionKey], log, date, completedAt: new Date().toISOString(), gymMode: sessionGymMode, startedAt: startTime || p.sessions?.[sessionKey]?.startedAt || Date.now() } }
    }));
    onComplete(summary);
  };
  
  const uncomplete = () => {
    onUpdate(p => ({
      ...p,
      sessions: { ...p.sessions, [sessionKey]: { ...p.sessions?.[sessionKey], completedAt: null } }
    }));
  };
  
  const allSetsDone = log.every(ex => ex.sets.every(s => s.done));
  const isCompleted = !!existing?.completedAt;
  const hasPriorProgress = log.some(ex => ex.sets.some(s => s.done));
  
  // Begin live session — locks in the start time and enables editing
  const startSession = () => {
    const now = Date.now();
    setStartTime(now);
    setIsLive(true);
    // If this session was previously marked skipped, clear that flag — starting it means it's back in play
    if (existing?.skipped) {
      onUpdate(p => ({
        ...p,
        sessions: { ...p.sessions, [sessionKey]: { ...p.sessions?.[sessionKey], skipped: false } }
      }));
    }
    if (navigator.vibrate) navigator.vibrate(30);
  };
  
  // Switch gym mode mid-session: swap exercises that haven't been logged yet
  const switchGymMode = (newMode) => {
    if (newMode === sessionGymMode) return;
    
    const anyLogged = log.some(ex => ex.sets.some(s => s.done));
    if (anyLogged) {
      if (!confirm(`Switch to ${newMode === 'office' ? 'OFFICE' : 'MAIN'} gym? Exercises you've already logged will stay; unlogged ones will swap to the ${newMode === 'office' ? 'office' : 'main'} variant.`)) {
        return;
      }
    }
    
    // For each exercise, if it has no completed sets, swap to the new variant
    const newLog = log.map(logEx => {
      const hasAnyDone = logEx.sets.some(s => s.done);
      if (hasAnyDone) return logEx;
      const baseEx = day.exercises.find(e => e.id === logEx.exerciseId);
      if (!baseEx) return logEx;
      const originalName = logEx._originalName || baseEx.name;
      let newName = originalName;
      let newOriginal;
      if (newMode === 'office') {
        const swap = getOfficeSwap(originalName);
        if (swap) { newName = swap; newOriginal = originalName; }
      }
      const next = { ...logEx, name: newName };
      if (newOriginal) next._originalName = newOriginal;
      else delete next._originalName;
      return next;
    });
    
    // Update local log state — the persist useEffect will save it
    setLog(newLog);
    // Persist mode on both the program and the session in a single update
    // (the useEffect will run after with the new log; we update gymMode here so it's
    // not overwritten — note: useEffect uses sessionGymMode which is recomputed from
    // updated existing on next render)
    onUpdate(p => ({
      ...p,
      gymMode: newMode,
      sessions: {
        ...p.sessions,
        [sessionKey]: {
          ...p.sessions?.[sessionKey],
          log: newLog,
          gymMode: newMode,
        }
      }
    }));
    if (navigator.vibrate) navigator.vibrate(30);
  };
  
  // Templates available for this day type
  const dayTemplates = useMemo(() => {
    return (program.templates || []).filter(t => t.dayId === day.id);
  }, [program.templates, day.id]);
  
  // Apply a template's overrides to the current session
  const applyTemplate = (template) => {
    const newLog = applyTemplateToLog(log, template);
    setLog(newLog);
    if (template.gymMode) {
      onUpdate(p => ({
        ...p,
        gymMode: template.gymMode,
        sessions: {
          ...p.sessions,
          [sessionKey]: { ...p.sessions?.[sessionKey], gymMode: template.gymMode, log: newLog }
        }
      }));
    }
    setApplyTemplateModal(false);
    setSessionMenu(false);
    if (navigator.vibrate) navigator.vibrate(30);
  };
  
  const saveAsTemplate = (name, gymMode) => {
    const overrides = snapshotOverrides(log, day);
    if (overrides.length === 0) {
      alert("No customizations to save. Make some SUB or EDIT changes first.");
      setSaveTemplateModal(false);
      setSessionMenu(false);
      return;
    }
    const tmpl = {
      id: uid(),
      name: name.trim() || `Custom — ${day.name}`,
      dayId: day.id,
      overrides,
      gymMode: gymMode || undefined,
      auto: false,
    };
    onUpdate(p => ({ ...p, templates: [...(p.templates || []), tmpl] }));
    setSaveTemplateModal(false);
    setSessionMenu(false);
  };
  
  const deleteTemplate = (templateId) => {
    if (!confirm('Delete this template?')) return;
    onUpdate(p => ({ ...p, templates: (p.templates || []).filter(t => t.id !== templateId) }));
  };
  
  // Copy current session's edits to other not-yet-started sessions of the same dayId.
  // includes: { name: bool, prescription: bool }
  const copyEditsToTargets = (targetSessionKeys, includes) => {
    const overrides = snapshotOverrides(log, day);
    if (overrides.length === 0) return;
    onUpdate(p => {
      const newSessions = { ...p.sessions };
      targetSessionKeys.forEach(key => {
        const target = newSessions[key];
        if (target?.completedAt || target?.startedAt) return;
        const baseLog = target?.log || buildSessionLog(day.exercises);
        const newLog = baseLog.map(logEx => {
          const ov = overrides.find(o => o.exerciseId === logEx.exerciseId);
          if (!ov) return logEx;
          const next = { ...logEx };
          if (includes.name && ov.name) {
            next._originalName = logEx._originalName || logEx.name;
            next.name = ov.name;
          }
          if (includes.prescription) {
            const prescriptionFields = ['sets', 'repsMin', 'repsMax', 'rest'];
            const hasAny = prescriptionFields.some(f => ov[f] != null);
            if (hasAny) {
              const newPrescription = { ...(logEx.prescription || {}) };
              prescriptionFields.forEach(f => { if (ov[f] != null) newPrescription[f] = ov[f]; });
              next.prescription = newPrescription;
              if (ov.sets != null && ov.sets !== next.sets.length) {
                const diff = ov.sets - next.sets.length;
                if (diff > 0) next.sets = [...next.sets, ...Array.from({ length: diff }, () => blankSet())];
                else next.sets = next.sets.slice(0, ov.sets);
              }
            }
          }
          return next;
        });
        newSessions[key] = { ...target, log: newLog };
      });
      return { ...p, sessions: newSessions };
    });
    setCopyEditsModal(false);
    setSessionMenu(false);
  };
  
  // Sessions of the same dayId in this program that aren't started/completed yet — viable copy targets
  const copyTargets = useMemo(() => {
    const targets = [];
    for (let w = 1; w <= program.weeks; w++) {
      const key = `w${w}d${dayIdx}`;
      if (key === sessionKey) continue; // not this one
      const s = program.sessions?.[key];
      // Eligible if not started and not completed
      if (s?.startedAt || s?.completedAt) continue;
      targets.push({ key, week: w, dayIdx, dayName: day.name });
    }
    return targets;
  }, [program.sessions, program.weeks, dayIdx, sessionKey, day.name]);
  
  return (
    <div className="app">
      {/* Thin rest timer strip at top */}
      {timer && (
        <>
          <div className="rest-strip">
            <div className="rest-strip-fill" style={{ width: timerDone ? '100%' : timerProgress + '%' }} />
          </div>
          <div className={`rest-label ${timerDone ? 'done' : ''}`} onClick={() => setTimer(null)}>
            {timerDone ? 'REST DONE ✓' : `${Math.floor(timerRemaining/60)}:${String(timerRemaining%60).padStart(2,'0')}`}
          </div>
        </>
      )}
      
      <div className="header">
        <button className="back-btn" onClick={onBack}>← BACK</button>
        <div className="header-title">W{week} · {day.name.toUpperCase()}</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
          <input type="date" value={date} onChange={e => setDate(e.target.value)} style={{ background: 'transparent', border: 'none', color: 'var(--text-dim)', fontFamily: 'var(--mono)', fontSize: 11, width: 76 }} />
          <button className="back-btn" onClick={() => setSessionMenu(true)} style={{ fontSize: 18, padding: '4px 6px' }}>⋯</button>
        </div>
      </div>
      
      <div className={`content ${!isLive && !isCompleted ? 'session-preview' : ''}`}>
        <div className="workout-header">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
            <div className="workout-week">WEEK {week} / {program.weeks}</div>
            <div className="gym-pill" role="group" aria-label="Gym mode">
              <button
                className={`gym-pill-opt ${sessionGymMode !== 'office' ? 'active-main' : ''}`}
                onClick={() => switchGymMode('main')}
              >MAIN</button>
              <button
                className={`gym-pill-opt ${sessionGymMode === 'office' ? 'active-office' : ''}`}
                onClick={() => switchGymMode('office')}
              >OFFICE</button>
            </div>
          </div>
          <div className="workout-day-title">{day.name}</div>
          <div className="workout-date">{fmtDate(date)}{prevSession ? ` · Last: ${fmtDate(prevSession.date)}` : ''}</div>
        </div>
        
        {!isLive && !isCompleted && (
          <div className="preview-banner">
            <div className="preview-banner-icon">⊙</div>
            <div className="preview-banner-text">
              <strong>PREVIEW</strong>{hasPriorProgress ? ' · Previous data shown' : ''}<br/>
              SUB or EDIT exercises now if needed. Tap {hasPriorProgress ? 'RESUME' : 'START'} when ready to log.
            </div>
          </div>
        )}
        
        {/* Template chips — visible in preview when templates exist for this day */}
        {!isLive && !isCompleted && dayTemplates.length > 0 && (
          <div className="template-chips">
            <span className="template-chips-label">Apply:</span>
            {dayTemplates.map(t => (
              <button
                key={t.id}
                className={`template-chip ${t.gymMode === 'office' ? 'is-office' : ''}`}
                onClick={() => applyTemplate(t)}
              >
                {t.name}
              </button>
            ))}
          </div>
        )}
        
        {/* Quick jump bar — one pill per exercise */}
        <div className="jump-bar">
          {log.map((ex, i) => {
            const st = exerciseStatuses[i];
            const isNext = i === upNextIdx;
            return (
              <button
                key={i}
                className={`jump-pill jump-${st.status} ${isNext ? 'is-next' : ''}`}
                onClick={() => scrollToExercise(i)}
                aria-label={`Jump to ${ex.name} (${st.doneSets}/${st.totalSets} sets done)`}
              >
                <span className="jump-pill-num">{i + 1}</span>
                <span className="jump-pill-dot"></span>
              </button>
            );
          })}
        </div>
        
        {/* Glance bar */}
        <div className="glance-bar">
          <div className="glance-stat">
            <div className="glance-stat-value">{glance.done}<span style={{color:'var(--text-faint)', fontSize: 14}}>/{glance.total}</span></div>
            <div className="glance-stat-label">Sets</div>
          </div>
          <div className="glance-divider"></div>
          <div className="glance-progress">
            <div className="glance-progress-fill" style={{ transform: `scaleX(${glance.total ? glance.done / glance.total : 0})` }} />
          </div>
          <div className="glance-divider"></div>
          <div className="glance-stat">
            <div className="glance-stat-value">{glance.elapsed}<span style={{color:'var(--text-faint)', fontSize: 14}}>m</span></div>
            <div className="glance-stat-label">Elapsed</div>
          </div>
        </div>
        
        {log.map((logEx, exIdx) => {
          const baseExercise = day.exercises.find(e => e.id === logEx.exerciseId);
          const prescription = logEx.prescription || {
            sets: logEx.sets.length, repsMin: baseExercise?.repsMin, repsMax: baseExercise?.repsMax, rest: baseExercise?.rest,
          };
          const prevExLog = prevSession?.log?.find(e => e.exerciseId === logEx.exerciseId);
          const wasSwapped = logEx._originalName && logEx._originalName !== logEx.name;
          const hasPR = !!prMap[exIdx];
          const status = exerciseStatuses[exIdx];
          const isNext = exIdx === upNextIdx;
          const expanded = isExpanded(exIdx);
          const isCompleteCollapsed = status.status === 'complete' && !expanded;
          
          // Top-set for collapsed summary line
          const topSet = isCompleteCollapsed
            ? logEx.sets.reduce((best, s) => {
                if (!s.done || !s.weight) return best;
                const w = parseFloat(s.weight);
                if (!best || w > best.w) return { w: w, weight: s.weight, reps: s.reps };
                return best;
              }, null)
            : null;
          
          return (
            <div
              key={exIdx}
              ref={(el) => { if (el) exerciseRefs.current[exIdx] = el; }}
              className={`exercise-block ${wasSwapped ? 'swapped' : ''} ${hasPR ? 'has-pr' : ''} status-${status.status} ${isNext ? 'is-next' : ''} ${isCompleteCollapsed ? 'collapsed' : ''}`}
            >
              {isCompleteCollapsed ? (
                /* Collapsed view: one-line summary, tap to expand */
                <button className="exercise-block-collapsed" onClick={() => toggleExpanded(exIdx)}>
                  <span className="collapsed-check">✓</span>
                  <span className="collapsed-name">{logEx.name}{hasPR && <span className="pr-badge">PR</span>}</span>
                  <span className="collapsed-top">{topSet ? `${topSet.weight}×${topSet.reps}` : ''}</span>
                  <span className="collapsed-expand">▾</span>
                </button>
              ) : (
                <>
                  <div className="exercise-block-header">
                    <div className="exercise-block-title">
                      {isNext && <span className="next-marker">▸</span>}
                      {logEx.name}
                      {hasPR && <span className="pr-badge">PR</span>}
                      {wasSwapped && <span className="badge-office">SWAPPED</span>}
                      <div className="exercise-block-target">
                        <span className="set-progress">{status.doneSets}/{status.totalSets}</span>
                        {' · '}{prescription.repsMin === prescription.repsMax ? prescription.repsMax : `${prescription.repsMin}–${prescription.repsMax}`} reps · {prescription.rest}s
                        {baseExercise?.note && ` · ${baseExercise.note}`}
                      </div>
                    </div>
                    <div className="exercise-actions">
                      {status.status === 'complete' && (
                        <button className="exercise-action-btn" onClick={() => toggleExpanded(exIdx)} title="Collapse">▴</button>
                      )}
                      <button className="exercise-action-btn" onClick={() => setSubModal({ exIdx })}>SUB</button>
                      <button className="exercise-action-btn" onClick={() => setEditModal({ exIdx, prescription })}>EDIT</button>
                    </div>
                  </div>
                  
                  <div className="sets-grid">
                    <div className="set-row headers">
                      <div className="set-header-cell">SET</div>
                      <div className="set-header-cell">WEIGHT</div>
                      <div className="set-header-cell">REPS</div>
                      <div className="set-header-cell">RPE</div>
                      <div className="set-header-cell"></div>
                    </div>
                    {logEx.sets.map((set, setIdx) => {
                      const prevSet = prevExLog?.sets?.[setIdx];
                      const isPRSet = prMap[exIdx]?.[setIdx];
                      const showGhostWeight = !set.weight && prevSet?.weight;
                      const showGhostReps = !set.reps && prevSet?.reps;
                      return (
                        <div key={setIdx} className="set-row">
                          <div className={`set-num ${isPRSet ? 'is-pr' : ''}`}>{setIdx + 1}</div>
                          <input
                            className={`set-input ${set.done ? 'done' : ''} ${showGhostWeight ? 'ghost' : ''}`}
                            type="number" inputMode="decimal" step="0.5"
                            placeholder={prevSet?.weight || '—'}
                            value={showGhostWeight ? prevSet.weight : set.weight}
                            onFocus={(e) => { if (showGhostWeight) commitGhost(exIdx, setIdx, 'weight', prevSet.weight); }}
                            onChange={e => updateSet(exIdx, setIdx, { weight: e.target.value })}
                          />
                          <input
                            className={`set-input ${set.done ? 'done' : ''} ${showGhostReps ? 'ghost' : ''}`}
                            type="number" inputMode="numeric"
                            placeholder={prevSet?.reps || '—'}
                            value={showGhostReps ? prevSet.reps : set.reps}
                            onFocus={(e) => { if (showGhostReps) commitGhost(exIdx, setIdx, 'reps', prevSet.reps); }}
                            onChange={e => updateSet(exIdx, setIdx, { reps: e.target.value })}
                          />
                          <input
                            className={`set-input ${set.done ? 'done' : ''}`}
                            type="number" inputMode="decimal" step="0.5" min="1" max="10"
                            placeholder="—" value={set.rpe}
                            onChange={e => updateSet(exIdx, setIdx, { rpe: e.target.value })}
                          />
                          <button
                            className={`set-check ${set.done ? 'done' : ''}`}
                            onClick={() => toggleSetDone(exIdx, setIdx)}
                            onDoubleClick={() => removeSet(exIdx, setIdx)}
                          >{set.done ? '✓' : '○'}</button>
                        </div>
                      );
                    })}
                    <button className="add-exercise-btn" style={{ marginTop: 8, padding: 10, fontSize: 10 }} onClick={() => addSet(exIdx)}>+ ADD SET</button>
                  </div>
                  
                  <div className="exercise-notes-section">
                    <textarea className="notes-textarea" placeholder="Notes (form cues, pain, observations...)" value={logEx.notes} onChange={e => setLog(log.map((ex, i) => i === exIdx ? { ...ex, notes: e.target.value } : ex))} style={{ minHeight: 40 }} />
                  </div>
                </>
              )}
            </div>
          );
        })}
      </div>
      
      <div className="fab">
        {isCompleted ? (
          <button className="btn-secondary" onClick={uncomplete}>✓ COMPLETED · TAP TO REOPEN</button>
        ) : !isLive ? (
          <button className="btn-primary" onClick={startSession}>
            ▶ {hasPriorProgress ? 'Resume Workout' : 'Start Workout'}
          </button>
        ) : (
          <button className="btn-primary" onClick={completeWorkout} style={allSetsDone ? {} : { background: 'var(--surface)', color: 'var(--text)', border: '1px solid var(--border-strong)', boxShadow: 'none' }}>
            {allSetsDone ? '✓ Complete Workout' : 'Finish Workout'}
          </button>
        )}
      </div>
      
      {subModal && <SubstituteModal currentName={log[subModal.exIdx].name} onPick={(name, scope) => substituteExercise(subModal.exIdx, name, scope)} onClose={() => setSubModal(null)} />}
      {editModal && <SessionExerciseEditModal prescription={editModal.prescription} onSave={(patch) => editPrescription(editModal.exIdx, patch)} onClose={() => setEditModal(null)} />}
      
      {/* Session kebab menu */}
      {sessionMenu && (
        <div className="modal-backdrop" onClick={() => setSessionMenu(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-title">SESSION OPTIONS</div>
            <button
              className="menu-item"
              onClick={() => { setSessionMenu(false); setApplyTemplateModal(true); }}
              disabled={dayTemplates.length === 0}
              style={dayTemplates.length === 0 ? { opacity: 0.4 } : {}}
            >
              <span>Apply Template{dayTemplates.length > 0 ? ` (${dayTemplates.length})` : ''}</span>
              <span className="arrow">→</span>
            </button>
            <button
              className="menu-item"
              onClick={() => { setSessionMenu(false); setSaveTemplateModal(true); }}
            >
              <span>Save as Template</span>
              <span className="arrow">→</span>
            </button>
            <button
              className="menu-item"
              onClick={() => { setSessionMenu(false); setCopyEditsModal(true); }}
              disabled={copyTargets.length === 0}
              style={copyTargets.length === 0 ? { opacity: 0.4 } : {}}
            >
              <span>Copy Edits to Other Weeks{copyTargets.length > 0 ? ` (${copyTargets.length})` : ''}</span>
              <span className="arrow">→</span>
            </button>
            <button className="btn-ghost" style={{ width: '100%', marginTop: 16 }} onClick={() => setSessionMenu(false)}>Close</button>
          </div>
        </div>
      )}
      
      {applyTemplateModal && (
        <ApplyTemplateModal
          templates={dayTemplates}
          onApply={applyTemplate}
          onDelete={deleteTemplate}
          onClose={() => setApplyTemplateModal(false)}
        />
      )}
      
      {saveTemplateModal && (
        <SaveTemplateModal
          dayName={day.name}
          defaultGymMode={sessionGymMode}
          onSave={saveAsTemplate}
          onClose={() => setSaveTemplateModal(false)}
        />
      )}
      
      {copyEditsModal && (
        <CopyEditsModal
          targets={copyTargets}
          onCopy={copyEditsToTargets}
          onClose={() => setCopyEditsModal(false)}
        />
      )}
    </div>
  );
}

// ============ SUMMARY ============
function SummaryView({ summary, onDone }) {
  if (!summary) return null;
  const lbs = Math.round(summary.totalVolume).toLocaleString();
  const candidates = summary.skipCandidates || [];
  // Default each candidate to "skip" checked
  const [skipSelections, setSkipSelections] = useState(
    () => Object.fromEntries(candidates.map(c => [`w${c.week}d${c.dayIdx}`, true]))
  );
  
  const handleDone = () => {
    const toSkip = candidates.filter(c => skipSelections[`w${c.week}d${c.dayIdx}`]);
    onDone(toSkip);
  };
  
  return (
    <div className="app" style={{ position: 'relative' }}>
      <div className="summary-bg"></div>
      <div className="summary-content">
        <div className="summary-eyebrow">Workout Complete</div>
        <div className="summary-title">{summary.dayName}</div>
        <div className="summary-sub">Week {summary.week} · {fmtDate(summary.date)}</div>
        
        <div className="summary-stats">
          <div className="summary-stat">
            <div className="summary-stat-value">{summary.completedSets}</div>
            <div className="summary-stat-label">Sets</div>
          </div>
          <div className="summary-stat">
            <div className="summary-stat-value">{summary.durationMin}<span style={{fontSize: 20}}>m</span></div>
            <div className="summary-stat-label">Duration</div>
          </div>
          <div className="summary-stat">
            <div className="summary-stat-value">{lbs}</div>
            <div className="summary-stat-label">Volume</div>
          </div>
          <div className="summary-stat">
            <div className="summary-stat-value">{summary.prs.length}</div>
            <div className="summary-stat-label">PRs</div>
          </div>
        </div>
        
        {summary.prs.length > 0 && (
          <div className="summary-prs">
            <div className="summary-prs-title">★ Personal Records</div>
            {summary.prs.map((pr, i) => (
              <div key={i} className="summary-pr-item">
                <div className="summary-pr-name">{pr.name}</div>
                <div className="summary-pr-vals">
                  {pr.prev && <span className="prev">{pr.prev.weight}×{pr.prev.reps}</span>}
                  {pr.weight}×{pr.reps}
                </div>
              </div>
            ))}
          </div>
        )}
        
        {candidates.length > 0 && (
          <div className="summary-skip">
            <div className="summary-skip-title">Missed Days</div>
            <div className="summary-skip-sub">Tap any day to mark as <strong>skipped</strong> (or untap to keep as TODO).</div>
            {candidates.map((c) => {
              const key = `w${c.week}d${c.dayIdx}`;
              const checked = skipSelections[key];
              return (
                <button
                  key={key}
                  className={`skip-row ${checked ? 'checked' : ''}`}
                  onClick={() => setSkipSelections(s => ({ ...s, [key]: !s[key] }))}
                >
                  <span className="skip-row-check">{checked ? '✓' : '○'}</span>
                  <span className="skip-row-label">W{c.week} · {c.dayName}</span>
                  <span className="skip-row-status">{checked ? 'SKIP' : 'KEEP'}</span>
                </button>
              );
            })}
          </div>
        )}
        
        <div style={{ flex: 1 }}></div>
        
        <button className="btn-primary" onClick={handleDone}>Done</button>
      </div>
    </div>
  );
}

// ============ WEEK SUMMARY ============
function WeekSummaryView({ program, week, onDone }) {
  const ws = useMemo(() => computeWeekStats(program, week), [program, week]);
  const prevWs = useMemo(() => week > 1 ? computeWeekStats(program, week - 1) : null, [program, week]);
  const weekPRs = useMemo(() => findWeekPRs(program, week), [program, week]);
  
  const volumeDelta = prevWs && prevWs.totalVolume > 0 ? ((ws.totalVolume - prevWs.totalVolume) / prevWs.totalVolume) * 100 : null;
  const setsDelta = prevWs ? ws.completedSets - prevWs.completedSets : null;
  
  const lbs = Math.round(ws.totalVolume).toLocaleString();
  
  return (
    <div className="app" style={{ position: 'relative' }}>
      <div className="summary-bg"></div>
      <div className="summary-content">
        <div className="summary-eyebrow">Week Complete</div>
        <div className="summary-title">Week {week}</div>
        <div className="summary-sub">{program.name.toUpperCase()}</div>
        
        <div className="summary-stats">
          <div className="summary-stat">
            <div className="summary-stat-value">{ws.workoutsCompleted}<span style={{fontSize: 18, color: 'var(--text-faint)'}}>/{program.days.length}</span></div>
            <div className="summary-stat-label">Workouts</div>
          </div>
          <div className="summary-stat">
            <div className="summary-stat-value">{ws.completedSets}</div>
            <div className="summary-stat-label">Sets</div>
            {setsDelta !== null && (
              <div className="stat-delta" style={{ color: setsDelta >= 0 ? 'var(--success)' : 'var(--danger)' }}>
                {setsDelta >= 0 ? '+' : ''}{setsDelta} vs W{week-1}

            )}
          </div>
          <div className="summary-stat">
            <div className="summary-stat-value">{lbs}</div>
            <div className="summary-stat-label">Volume</div>
            {volumeDelta !== null && (
              <div className="stat-delta" style={{ color: volumeDelta >= 0 ? 'var(--success)' : 'var(--danger)' }}>
                {volumeDelta >= 0 ? '+' : ''}{volumeDelta.toFixed(0)}% vs W{week-1}

            <div className="summary-stat-value">{weekPRs.length}</div>
            <div className="summary-stat-label">PRs</div>

        {weekPRs.length > 0 && (
          <div className="summary-prs">
            <div className="summary-prs-title">★ Personal Records This Week</div>
            {weekPRs.map((pr, i) => (
              <div key={i} className="summary-pr-item">
                <div className="summary-pr-name">{pr.name}</div>
                <div className="summary-pr-vals">
                  {pr.prev && <span className="prev">{pr.prev.weight}×{pr.prev.reps}</span>}
                  {pr.weight}×{pr.reps}

              </div>

          </div>
        )}

            <div key={i} className={`week-day-row wd-${d.status}`}>
              <div className="week-day-name">{d.dayName}</div>
              {d.status === 'done' && (
                <div className="week-day-stats mono">
                  {d.completedSets} sets · {Math.round(d.totalVolume).toLocaleString()}
                </div>
              )}
              {d.status === 'skipped' && <div className="week-day-stats mono">SKIPPED</div>}

// ============ PROGRAM SUMMARY ============
function ProgramSummaryView({ program, onDone }) {
  const ps = useMemo(() => computeProgramStats(program), [program]);
  const lbs = Math.round(ps.totalVolume).toLocaleString();
  
  // SVG line chart of weekly volume
  const chartData = ps.weekStats.map(ws => ({ week: ws.week, volume: ws.totalVolume }));
  const maxVol = Math.max(1, ...chartData.map(d => d.volume));
  const chartW = 280, chartH = 100, padL = 28, padR = 12, padT = 8, padB = 22;
  const plotW = chartW - padL - padR, plotH = chartH - padT - padB;
  const xStep = chartData.length > 1 ? plotW / (chartData.length - 1) : 0;
  const pts = chartData.map((d, i) => ({
    x: padL + i * xStep,
    y: padT + plotH - (d.volume / maxVol) * plotH,
    week: d.week,
    volume: d.volume,
  }));
  const path = pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
  const areaPath = pts.length > 0
    ? `${path} L ${pts[pts.length-1].x.toFixed(1)} ${(padT + plotH).toFixed(1)} L ${padL.toFixed(1)} ${(padT + plotH).toFixed(1)} Z`
    : '';
  
  // Top 5 PRs by deltaPct from progressions
  const topGains = ps.progressions.filter(p => p.deltaPct > 0).slice(0, 8);
  
  return (
    <div className="app" style={{ position: 'relative' }}>
      <div className="summary-bg"></div>
      <div className="summary-content" style={{ paddingBottom: '120px' }}>
        <div className="summary-eyebrow">Program Complete</div>
        <div className="summary-title" style={{ fontSize: 48 }}>{program.name}</div>
        <div className="summary-sub">{program.weeks} WEEKS · {ps.totalWorkouts} WORKOUTS LOGGED</div>
        
        <div className="summary-stats">
          <div className="summary-stat">
            <div className="summary-stat-value">{ps.totalWorkouts}</div>
            <div className="summary-stat-label">Workouts</div>
          </div>
          <div className="summary-stat">
            <div className="summary-stat-value">{ps.totalCompletedSets}</div>
            <div className="summary-stat-label">Sets</div>
          </div>
          <div className="summary-stat">
            <div className="summary-stat-value">{lbs}</div>
            <div className="summary-stat-label">Lbs Lifted</div>
          </div>
          <div className="summary-stat">
            <div className="summary-stat-value">{ps.allPRs.length}</div>
            <div className="summary-stat-label">PRs</div>
          </div>
        </div>
        
        {/* Volume chart */}
        {chartData.length > 1 && (
          <div className="prog-summary-chart">
            <div className="prog-summary-chart-title">Weekly Volume</div>
            <svg viewBox={`0 0 ${chartW} ${chartH}`} className="prog-chart-svg" preserveAspectRatio="none">
              <defs>
                <linearGradient id="volgrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="var(--accent)" stopOpacity="0.35"/>
                  <stop offset="100%" stopColor="var(--accent)" stopOpacity="0"/>
                </linearGradient>
              </defs>
              {/* baseline */}
              <line x1={padL} y1={padT + plotH} x2={chartW - padR} y2={padT + plotH} stroke="var(--border)" strokeWidth="1" />
              {areaPath && <path d={areaPath} fill="url(#volgrad)" />}
              <path d={path} stroke="var(--accent)" strokeWidth="2" fill="none" strokeLinejoin="round" strokeLinecap="round"/>
              {pts.map((p, i) => (
                <circle key={i} cx={p.x} cy={p.y} r="3" fill="var(--accent)" />
              ))}
              {/* week labels */}
              {pts.map((p, i) => (
                <text key={'l'+i} x={p.x} y={chartH - 6} textAnchor="middle" fill="var(--text-faint)" style={{ fontSize: 9, fontFamily: 'var(--mono)' }}>{p.week}</text>
              ))}
            </svg>
          </div>
        )}
        
        {/* Top gains */}
        {topGains.length > 0 && (
          <div className="prog-summary-section">
            <div className="prog-summary-section-title">Biggest Gains</div>
            {topGains.map((g, i) => (
              <div key={i} className="gain-row">
                <div className="gain-name">{g.name}</div>
                <div className="gain-detail">
                  <span className="gain-from">W{g.firstWeek}: {g.firstWeight}×{g.firstReps}</span>
                  <span className="gain-arrow">→</span>
                  <span className="gain-to">W{g.lastWeek}: {g.lastWeight}×{g.lastReps}</span>
                </div>
                <div className="gain-pct">+{g.deltaPct.toFixed(0)}%</div>
              </div>
            ))}
          </div>
        )}
        
        {/* All PRs */}
        {ps.allPRs.length > 0 && (
          <div className="summary-prs">
            <div className="summary-prs-title">★ All Personal Records</div>
            {ps.allPRs.map((pr, i) => (
              <div key={i} className="summary-pr-item">
                <div>
                  <div className="summary-pr-name">{pr.name}</div>
                  <div className="text-faint mono" style={{ fontSize: 10, letterSpacing: '0.05em', marginTop: 2 }}>W{pr.week} · {fmtDate(pr.date)}</div>
                </div>
                <div className="summary-pr-vals">
                  {pr.prev && <span className="prev">{pr.prev.weight}×{pr.prev.reps}</span>}
                  {pr.weight}×{pr.reps}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
      
      <div className="fab">
        <button className="btn-primary" onClick={onDone}>Done</button>
      </div>
    </div>
  );
}

// ============ PAST SESSION VIEW (read-only summary) ============
function PastSessionView({ program, week, dayIdx, onBack, onReopen }) {
  const session = program.sessions?.[`w${week}d${dayIdx}`];
  const day = program.days[dayIdx];
  const stats = useMemo(() => session?.log ? computeSessionStats(session.log) : null, [session]);
  const prMap = useMemo(() => session?.log ? detectPRs(program, week, dayIdx, session.log) : {}, [program, week, dayIdx, session]);
  
  if (!session || !session.completedAt) {
    return (
      <div className="app">
        <div className="header">
          <button className="back-btn" onClick={onBack}>← BACK</button>
          <div className="header-title">PAST SESSION</div>
          <div style={{width: 60}}></div>
        </div>
        <div className="content"><div className="empty"><div className="empty-text">No data for this session</div></div></div>
      </div>
    );
  }
  
  const duration = session.startedAt && session.completedAt
    ? Math.max(1, Math.round((new Date(session.completedAt).getTime() - session.startedAt) / 60000))
    : null;
  
  // Build PR list from prMap
  const prList = [];
  session.log.forEach((logEx, exIdx) => {
    if (!prMap[exIdx]) return;
    let best = null;
    Object.entries(prMap[exIdx]).forEach(([setIdx, p]) => {
      if (!best || p.weight > best.weight) best = p;
    });
    if (best) prList.push({ name: logEx.name, weight: best.weight, reps: best.reps, prev: best.prev });
  });
  
  const lbs = Math.round(stats.totalVolume).toLocaleString();
  
  return (
    <div className="app" style={{ position: 'relative' }}>
      <div className="header">
        <button className="back-btn" onClick={onBack}>← BACK</button>
        <div className="header-title">W{week} · {day.name.toUpperCase()}</div>
        <button className="back-btn" onClick={onReopen} style={{ color: 'var(--accent)' }}>EDIT</button>
      </div>
      <div className="content">
        <div className="workout-week">WEEK {week} / {program.weeks} · {session.gymMode === 'office' ? 'OFFICE' : 'MAIN'} GYM</div>
        <div className="workout-day-title">{day.name}</div>
        <div className="workout-date">{fmtDate(session.date)} · {stats.completedSets} sets logged{duration ? ` · ${duration} min` : ''}</div>
        
        <div className="summary-stats" style={{ marginTop: 24 }}>
          <div className="summary-stat">
            <div className="summary-stat-value">{stats.completedSets}</div>
            <div className="summary-stat-label">Sets</div>
          </div>
          <div className="summary-stat">
            <div className="summary-stat-value">{lbs}</div>
            <div className="summary-stat-label">Volume</div>
          </div>
          {duration && (
            <div className="summary-stat">
              <div className="summary-stat-value">{duration}<span style={{fontSize: 18}}>m</span></div>
              <div className="summary-stat-label">Duration</div>
            </div>
          )}
          <div className="summary-stat">
            <div className="summary-stat-value">{prList.length}</div>
            <div className="summary-stat-label">PRs</div>
          </div>
        </div>
        
        {prList.length > 0 && (
          <div className="summary-prs" style={{ marginTop: 24 }}>
            <div className="summary-prs-title">★ Personal Records</div>
            {prList.map((pr, i) => (
              <div key={i} className="summary-pr-item">
                <div className="summary-pr-name">{pr.name}</div>
                <div className="summary-pr-vals">
                  {pr.prev && <span className="prev">{pr.prev.weight}×{pr.prev.reps}</span>}
                  {pr.weight}×{pr.reps}
                </div>
              </div>
            ))}
          </div>
        )}
        
        <div style={{ marginTop: 24 }}>
          <div className="form-label">Exercise Log</div>
          {session.log.map((logEx, exIdx) => {
            const completedSets = logEx.sets.filter(s => s.done);
            return (
              <div key={exIdx} className="past-exercise">
                <div className="past-exercise-name">
                  {logEx.name}
                  {prMap[exIdx] && <span className="pr-badge">PR</span>}
                </div>
                {completedSets.length > 0 ? (
                  <div className="past-sets-list">
                    {completedSets.map((s, i) => (
                      <span key={i} className="past-set">
                        {s.weight}×{s.reps}{s.rpe ? ` @${s.rpe}` : ''}
                      </span>
                    ))}
                  </div>
                ) : (
                  <div className="past-no-sets">— no sets logged —</div>
                )}
                {logEx.notes && (
                  <div className="past-notes">"{logEx.notes}"</div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

// ============ SUBSTITUTE MODAL ============
function SubstituteModal({ currentName, onPick, onClose }) {
  const [search, setSearch] = useState('');
  const [pendingName, setPendingName] = useState(null);
  
  const suggested = useMemo(() => getAlternatives(currentName), [currentName]);
  
  const filtered = useMemo(() => {
    const q = search.toLowerCase().trim();
    const exclude = new Set([currentName.toLowerCase(), ...suggested.map(s => s.toLowerCase())]);
    if (!q) return EXERCISE_LIB.filter(e => !exclude.has(e.name.toLowerCase()));
    return EXERCISE_LIB.filter(e => e.name.toLowerCase().includes(q) && e.name.toLowerCase() !== currentName.toLowerCase());
  }, [search, currentName, suggested]);
  
  if (pendingName) {
    return (
      <div className="modal-backdrop" onClick={onClose}>
        <div className="modal" onClick={e => e.stopPropagation()}>
          <div className="modal-title">SUBSTITUTE SCOPE</div>
          <div style={{ marginBottom: 16, color: 'var(--text-dim)', fontSize: 14 }}>
            <strong style={{ color: 'var(--text)' }}>{currentName}</strong> → <strong style={{ color: 'var(--accent)' }}>{pendingName}</strong>
          </div>
          <button className="btn-secondary" style={{ marginBottom: 10 }} onClick={() => onPick(pendingName, 'session')}>Just for today</button>
          <button className="btn-primary" onClick={() => onPick(pendingName, 'program')}>Rest of program</button>
          <button className="btn-ghost" style={{ width: '100%', marginTop: 12 }} onClick={() => setPendingName(null)}>← Back</button>
        </div>
      </div>
    );
  }
  
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-title">SUBSTITUTE: {currentName.toUpperCase()}</div>
        <input className="lib-search" placeholder="Search or type custom..." value={search} onChange={e => setSearch(e.target.value)} />
        <div className="lib-list">
          {!search && suggested.length > 0 && (
            <>
              <div className="section-title">Suggested Alternatives</div>
              {suggested.map((altName, i) => {
                const info = findExerciseInfo(altName);
                return (
                  <button key={'a'+i} className="lib-item alt-item" onClick={() => setPendingName(altName)}>
                    <div>{altName}</div>
                    {info && <div className="lib-item-cat">{info.cat.toUpperCase()} · {info.eq.toUpperCase()}</div>}
                  </button>
                );
              })}
              <div className="section-title">All Exercises</div>
            </>
          )}
          {filtered.map((e, i) => (
            <button key={i} className="lib-item" onClick={() => setPendingName(e.name)}>
              <div>{e.name}</div>
              <div className="lib-item-cat">{e.cat.toUpperCase()} · {e.eq.toUpperCase()}</div>
            </button>
          ))}
          {search.trim() && !filtered.find(e => e.name.toLowerCase() === search.toLowerCase().trim()) && !suggested.find(s => s.toLowerCase() === search.toLowerCase().trim()) && (
            <button className="lib-item" onClick={() => setPendingName(search.trim())} style={{ color: 'var(--accent)' }}>
              <div>+ Use custom: "{search.trim()}"</div>
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// ============ SESSION EXERCISE EDIT MODAL ============
function SessionExerciseEditModal({ prescription, onSave, onClose }) {
  const [sets, setSets] = useState(prescription.sets);
  const [repsMin, setRepsMin] = useState(prescription.repsMin);
  const [repsMax, setRepsMax] = useState(prescription.repsMax);
  const [rest, setRest] = useState(prescription.rest);
  
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-title">EDIT FOR THIS SESSION</div>
        <div className="form-group">
          <label className="form-label">Sets</label>
          <input className="form-input" type="number" min="1" max="20" value={sets} onChange={e => setSets(Math.max(1, parseInt(e.target.value) || 1))} />
        </div>
        <div className="form-group">
          <label className="form-label">Rep Range</label>
          <div className="modal-row">
            <input className="form-input" type="number" min="1" max="100" placeholder="Min" value={repsMin} onChange={e => setRepsMin(Math.max(1, parseInt(e.target.value) || 1))} />
            <input className="form-input" type="number" min="1" max="100" placeholder="Max" value={repsMax} onChange={e => setRepsMax(Math.max(1, parseInt(e.target.value) || 1))} />
          </div>
        </div>
        <div className="form-group">
          <label className="form-label">Rest (seconds)</label>
          <input className="form-input" type="number" min="0" step="15" value={rest} onChange={e => setRest(Math.max(0, parseInt(e.target.value) || 0))} />
        </div>
        <button className="btn-primary" onClick={() => onSave({ sets, repsMin, repsMax, rest })}>Apply</button>
      </div>
    </div>
  );
}

  const [name, setName] = useState(`Custom — ${dayName}`);
  const [gymMode, setGymMode] = useState(defaultGymMode === 'office' ? 'office' : '');
  
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-title">SAVE AS TEMPLATE</div>
        <div className="form-group">
          <label className="form-label">Template Name</label>
          <input className="form-input" value={name} onChange={e => setName(e.target.value)} placeholder={`Custom — ${dayName}`} autoFocus />
        </div>
        <div className="form-group">
          <label className="form-label">Gym Mode (Optional)</label>
          <div className="seg">
            <button className={`seg-opt ${gymMode === '' ? 'active' : ''}`} onClick={() => setGymMode('')}>NONE</button>
            <button className={`seg-opt ${gymMode === 'main' ? 'active' : ''}`} onClick={() => setGymMode('main')}>MAIN</button>
            <button className={`seg-opt ${gymMode === 'office' ? 'active-office' : ''}`} onClick={() => setGymMode('office')}>OFFICE</button>
          </div>

          </div>
        </div>
        <button className="btn-primary" onClick={() => onSave(name, gymMode || undefined)}>Save Template</button>

      </div>
    </div>
  );
}

// ============ COPY EDITS MODAL ============
function CopyEditsModal({ targets, onCopy, onClose }) {
  const [selected, setSelected] = useState(() => new Set(targets.map(t => t.key))); // default: all selected
  const [includes, setIncludes] = useState({ name: true, prescription: true });
  
  const toggleTarget = (key) => {
    setSelected(prev => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key);
      else next.add(key);
      return next;
    });
  };
  
  const canCopy = selected.size > 0 && (includes.name || includes.prescription);
  
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <div className="modal-title">COPY EDITS TO OTHER WEEKS</div>
        
        <div className="form-group">
          <label className="form-label">What to Copy</label>
          <div className="copy-includes">
            <button
              className={`copy-include-toggle ${includes.name ? 'on' : ''}`}
              onClick={() => setIncludes(i => ({ ...i, name: !i.name }))}
            >
              <span>{includes.name ? '✓' : '○'}</span> SUBS
            </button>
            <button
              className={`copy-include-toggle ${includes.prescription ? 'on' : ''}`}
              onClick={() => setIncludes(i => ({ ...i, prescription: !i.prescription }))}
            >
              <span>{includes.prescription ? '✓' : '○'}</span> SETS/REPS
            </button>
          </div>
        </div>
        
        <div className="form-group">
          <label className="form-label">Target Sessions ({selected.size}/{targets.length})</label>
          {targets.map(t => {
            const checked = selected.has(t.key);
            return (
              <button
                key={t.key}
                className={`copy-target-row ${checked ? 'checked' : ''}`}
                onClick={() => toggleTarget(t.key)}
              >
                <span className="copy-target-check">{checked ? '✓' : '○'}</span>
                <span className="copy-target-label">Week {t.week} · {t.dayName}</span>
              </button>
            );
          })}
        </div>
        
        <button
          className="btn-primary"
          disabled={!canCopy}
          style={!canCopy ? { opacity: 0.4 } : {}}
          onClick={() => onCopy(Array.from(selected), includes)}
        >
          Copy to {selected.size} session{selected.size !== 1 ? 's' : ''}
        </button>
        <button className="btn-ghost" style={{ width: '100%', marginTop: 8 }} onClick={onClose}>Cancel</button>
      </div>
    </div>
  );
}

// ============ PROGRESSION VIEW ============
function ProgressionView({ program, onBack }) {
  const exerciseProgress = useMemo(() => {
    const map = {};
    for (let w = 1; w <= program.weeks; w++) {
      for (let d = 0; d < program.days.length; d++) {
        const session = program.sessions?.[`w${w}d${d}`];
        if (!session?.log) continue;
        session.log.forEach(logEx => {
          if (!map[logEx.exerciseId]) map[logEx.exerciseId] = { name: logEx.name, weeks: {} };
          const completedSets = logEx.sets.filter(s => s.done && s.weight && s.reps);
          if (completedSets.length === 0) return;
          map[logEx.exerciseId].weeks[w] = {
            sets: completedSets,
            topSet: completedSets.reduce((a, b) => (parseFloat(b.weight) > parseFloat(a.weight) ? b : a)),
          };
        });
      }
    }
    return map;
  }, [program]);
  
  const exercises = Object.entries(exerciseProgress);
  
  return (
    <div className="app">
      <div className="header">
        <button className="back-btn" onClick={onBack}>← BACK</button>
        <div className="header-title">PROGRESSION</div>
        <div style={{ width: 60 }}></div>
      </div>
      <div className="content">
        <div style={{ fontFamily: 'var(--display)', fontStyle: 'italic', fontWeight: 900, fontSize: 32, marginBottom: 4, letterSpacing: '-0.02em' }}>Progression</div>
        <div className="program-meta" style={{ marginBottom: 24 }}>{program.name.toUpperCase()}</div>
        
        {exercises.length === 0 ? (
          <div className="empty">
            <div className="empty-icon">≡</div>
            <div className="empty-text">No data yet</div>
            <div style={{ marginTop: 8, fontSize: 12 }}>Complete some sets to see progression</div>
          </div>
        ) : (
          exercises.map(([exId, data]) => {
            const weekEntries = Object.entries(data.weeks).sort((a, b) => parseInt(a[0]) - parseInt(b[0]));
            return (
              <div key={exId} className="prog-exercise">
                <div className="prog-exercise-name">{data.name}</div>
                <table className="prog-table">
                  <thead><tr><th>WK</th><th>TOP SET</th><th>VOLUME</th><th>Δ</th></tr></thead>
                  <tbody>
                    {weekEntries.map(([w, wd], i) => {
                      const volume = wd.sets.reduce((acc, s) => acc + (parseFloat(s.weight) * parseInt(s.reps)), 0);
                      const prevVolume = i > 0 ? weekEntries[i-1][1].sets.reduce((acc, s) => acc + (parseFloat(s.weight) * parseInt(s.reps)), 0) : null;
                      const delta = prevVolume ? volume - prevVolume : null;
                      const isLast = i === weekEntries.length - 1;
                      return (
                        <tr key={w}>
                          <td className={isLast ? 'current' : ''}>W{w}</td>
                          <td className={isLast ? 'current' : ''}>{wd.topSet.weight} × {wd.topSet.reps}{wd.topSet.rpe ? ` @${wd.topSet.rpe}` : ''}</td>
                          <td className={isLast ? 'current' : ''}>{Math.round(volume)}</td>
                          <td style={{ color: delta == null ? 'var(--text-faint)' : (delta >= 0 ? 'var(--success)' : 'var(--danger)') }}>
                            {delta == null ? '—' : (delta >= 0 ? '+' : '') + Math.round(delta)}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            );
          })
        )}
      </div>
    </div>
  );
}
